                                  }

                                  if (!meal) {
                                    return (
                                      <td
                                        key={offsetIdx}
                                        className="py-4 px-3 text-center align-middle border-r last:border-r-0 border-stone-200/70"
                                      >
                                        <span className="text-xs text-slate-300">-</span>
                                      </td>
                                    );
                                  }

                                  return (
                                    <td
                                      key={offsetIdx}
                                      onClick={() => setSelectedRecipeMeal(meal)}
                                      className={`py-3 px-3 align-top border-r last:border-r-0 border-stone-200/70 cursor-pointer transition-colors ${
                                        isDone
                                          ? 'bg-emerald-50/70 hover:bg-emerald-100/60'
                                          : offsetIdx === 0
                                          ? 'bg-orange-50/35 hover:bg-orange-50/70'
                                          : 'hover:bg-stone-50'
                                      }`}
                                    >
                                      <div className="space-y-0.5">
                                        {formatMealLines(meal.title).map((line, lIdx) => (
                                          <p key={lIdx} className="text-xs sm:text-[13px] font-bold text-slate-900 leading-snug">
                                            {line}
                                          </p>
                                        ))}
                                      </div>
                                      {isDone && (
                                        <span className="inline-block mt-1.5 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-emerald-600 text-white">
                                          ✓ 완료됨
                                        </span>
                                      )}
                                    </td>
                                  );
                                })}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* 우측 컬럼: 먼저 써야 할 임박 식자재만 간결하게 표시 */}
                    <div className="lg:col-span-4 lg:sticky lg:top-6">
                      <div className="bg-white/95 rounded-3xl p-5 border border-white shadow-sm space-y-3.5">
                        <div className="flex items-center justify-between">
                          <h3 className="text-sm font-extrabold text-slate-900">먼저 써야 할 임박 식자재</h3>
                          <button onClick={() => setActiveTab('inventory')} className="text-xs font-bold text-emerald-600 hover:underline">
                            전체 재고 ({totalItems})
                          </button>
                        </div>

                        {expiringItems.length === 0 ? (
                          <div className="py-8 text-center bg-stone-50 rounded-2xl">
                            <p className="text-xs font-semibold text-slate-500">소비기한이 임박한 식자재가 없습니다</p>
                          </div>
                        ) : (
                          <div className="space-y-2.5">
                            {expiringItems.map((item) => {
                              const step = item.unit === 'g' || item.unit === 'ml' ? 50 : item.quantity < 1 ? 0.5 : 1;
                              return (
                                <div key={item.id} className="p-3 rounded-2xl bg-rose-50/50 border border-rose-200/70 flex items-center justify-between gap-2">
                                  <div>
                                    <div className="flex items-center gap-1.5">
                                      <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-rose-500 text-white">D-{item.daysLeft}</span>
                                      <span className="text-xs font-bold text-slate-900">{item.name}</span>
                                    </div>
                                    <p className="text-[11px] font-semibold text-rose-700 mt-1">남은 수량: {item.quantity}{item.unit}</p>
                                  </div>
                                  <div className="flex items-center gap-1.5">
                                    <button onClick={() => handleConsume(item.id, step, '임박 재료 소진')} className="px-2.5 py-1.5 rounded-xl bg-white hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-extrabold">
                                      -{step}{item.unit}
                                    </button>
                                    <button onClick={() => handleDeleteAll(item)} className="px-2.5 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">
                                      다 씀
                                    </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {/* VIEW 1: 식자재 재고 현황 ('현황') */}
                {activeTab === 'inventory' && (
                  <div className="space-y-5">
                    <div className="bg-white/90 rounded-3xl p-4 md:p-5 border border-white shadow-sm space-y-3.5">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div className="relative flex-1 max-w-md">
                          <input
                            type="text"
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            placeholder="냉장고 속 식재료 검색..."
                            className="w-full px-4 py-2.5 rounded-2xl bg-stone-100/80 border border-stone-200/70 text-sm focus:outline-none focus:bg-white focus:border-emerald-500"
                          />
                        </div>
                        <button
                          onClick={() => setIsAddModalOpen(true)}
                          className="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-extrabold text-xs shadow-md flex items-center justify-center gap-1.5"
                        >
                          <Icon name="plus" className="w-4 h-4" />
                          <span>식자재 직접 추가</span>
                        </button>
                      </div>

                      <div className="flex items-center gap-2 overflow-x-auto pb-1">
                        {['전체', '채소/과일', '정육/수산', '유제품/계란', '냉동/가공', '곡류/기타'].map((cat) => (
                          <button
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap ${
                              selectedCategory === cat ? 'bg-slate-900 text-white shadow-sm' : 'bg-stone-100/90 text-slate-600'
                            }`}
                          >
                            {cat}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                      {filteredInventory.map((item) => {
                        const catStyle = getCategoryStyle(item.category);
                        const isUrgent = item.daysLeft <= 2;
                        const step = item.unit === 'g' || item.unit === 'ml' ? 50 : item.quantity < 1 ? 0.5 : 1;
                        return (
                          <div key={item.id} className={`bg-white/95 rounded-2xl p-3.5 border flex flex-col justify-between gap-2.5 ${isUrgent ? 'border-rose-200 shadow-sm' : 'border-white shadow-sm'}`}>
                            <div className="flex items-start justify-between gap-1.5 min-w-0">
                              <div className="min-w-0">
                                <div className="flex items-center gap-1 flex-wrap">
                                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-stone-100 text-slate-600 shrink-0">{item.storage}</span>
                                  <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded border shrink-0 ${catStyle.bg}`}>{item.category.split('/')[0]}</span>
                                  <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded shrink-0 ${isUrgent ? 'bg-rose-500 text-white' : 'bg-emerald-50 text-emerald-700'}`}>
                                    D-{item.daysLeft}
                                  </span>
                                </div>
                                <h4 className="text-xs sm:text-sm font-extrabold text-slate-900 mt-1.5 truncate" title={item.name}>{item.name}</h4>
                              </div>
                              <div className="flex items-center gap-0.5 shrink-0">
                                <button
                                  type="button"
                                  onClick={() => setEditingItem({ ...item })}
                                  className="px-1.5 py-0.5 rounded-md text-[10px] font-extrabold text-slate-500 hover:text-emerald-700 hover:bg-emerald-50 transition-colors"
                                >
                                  수정
                                </button>
                                <button onClick={() => handleDeleteAll(item)} className="p-1 rounded-lg text-slate-400 hover:text-rose-600">
                                  <Icon name="trash" className="w-3.5 h-3.5" />
                                </button>
                              </div>
                            </div>

                            <div className="pt-2 border-t border-stone-100 flex items-center justify-between gap-1">
                              <div className="min-w-0">
                                <span className="text-[10px] font-semibold text-slate-400 block leading-none">현재 잔량</span>
                                <span className="text-sm font-extrabold text-slate-900 mt-0.5 block truncate">{item.quantity}{item.unit}</span>
                              </div>
                              <div className="flex items-center gap-1 shrink-0">
                                <button onClick={() => handleConsume(item.id, step, '수동 소진')} className="px-2 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 font-extrabold text-[11px]">
                                  -{step}{item.unit}
                                </button>
                                <button onClick={() => handleIncrease(item.id, step)} className="p-1 rounded-lg bg-stone-100 hover:bg-stone-200 text-slate-700">
                                  <Icon name="plus" className="w-3 h-3" />
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* VIEW 2: AI 마트 영수증 재고 등록 ('등록') */}
                {activeTab === 'receipt' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div className="lg:col-span-5 bg-white/95 rounded-3xl p-5 border border-white shadow-sm space-y-4">
                      <div className="flex items-center justify-between gap-2">
                        <div>
                          <h3 className="text-sm font-extrabold text-slate-900">영수증 사진 / 텍스트 등록</h3>
                          <p className="text-[11px] text-slate-500">영수증 촬영 · 캡처 업로드 또는 주문내역 복사</p>
                        </div>
                        <button type="button" onClick={() => setReceiptText(SAMPLE_RECEIPT_TEXT)} className="text-xs font-extrabold px-3 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 shrink-0">
                          샘플 넣기
                        </button>
                      </div>

                      <div className="space-y-2">
                        <input
                          ref={fileInputRef}
                          type="file"
                          accept="image/*"
                          onChange={handleReceiptImageUpload}
                          className="hidden"
                        />
                        {!receiptImagePreview ? (
                          <button
                            type="button"
                            onClick={() => fileInputRef.current?.click()}
                            className="w-full py-3 px-4 rounded-2xl border-2 border-dashed border-indigo-200 bg-indigo-50/40 hover:bg-indigo-50 text-indigo-700 flex items-center justify-center gap-2 text-xs font-extrabold transition-all"
                          >
                            <Icon name="camera" className="w-4 h-4" />
                            <span>영수증 사진 · 마트 앱 캡처 올리기</span>
                          </button>
                        ) : (
                          <div className="relative rounded-2xl overflow-hidden border border-indigo-200 bg-stone-100">
                            <img src={receiptImagePreview} alt="영수증 미리보기" className="w-full max-h-40 object-contain" />
                            <button
                              type="button"
                              onClick={handleClearReceiptImage}
                              className="absolute top-2 right-2 p-1.5 rounded-full bg-slate-900/80 text-white hover:bg-rose-600"
                            >
                              <Icon name="x" className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        )}
                      </div>

                      <textarea
                        rows={7}
                        value={receiptText}
                        onChange={(e) => setReceiptText(e.target.value)}
                        placeholder="마트 주문내역이나 영수증 텍스트를 붙여넣으세요..."
                        className="w-full p-3.5 rounded-2xl bg-stone-50 border border-stone-200 text-xs leading-relaxed focus:outline-none focus:bg-white focus:border-indigo-500"
                      />
                      {receiptError && <p className="text-xs font-bold text-rose-600 bg-rose-50 p-2.5 rounded-xl">{receiptError}</p>}
                      <button
                        onClick={handleParseReceipt}
                        disabled={isParsingReceipt}
                        className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:brightness-105 text-white font-extrabold text-sm shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95"
                      >
                        <Icon name="sparkles" className="w-4 h-4" />
                        <span>{isParsingReceipt ? '식자재 분석 중...' : '식자재 자동 추출하기'}</span>
                      </button>
                    </div>

                    <div className="lg:col-span-7 bg-white/95 rounded-3xl p-5 border border-white shadow-sm space-y-4">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                          <h3 className="text-sm font-extrabold text-slate-900">추출된 식자재 검수 ({parsedItems.length}건)</h3>
                          <p className="text-[11px] text-slate-500">품목·카테고리·수량·소비기한을 확인 후 일괄 등록하세요</p>
                        </div>
                        {parsedItems.length > 0 && (
                          <button onClick={handleConfirmAddParsedItems} className="px-4 py-2 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-md">
                            ✓ 냉장고에 일괄 등록
                          </button>
                        )}
                      </div>

                      {parsedItems.length === 0 ? (
                        <div className="py-14 text-center bg-stone-50/80 rounded-2xl border border-dashed border-stone-200 space-y-2 px-4">
                          <p className="text-xs font-bold text-slate-500">좌측에 영수증 사진이나 주문내역을 넣고 [식자재 자동 추출하기]를 눌러주세요.</p>
                        </div>
                      ) : (
                        <div className="space-y-2.5 max-h-[480px] overflow-y-auto pr-1">
                          {parsedItems.map((item) => (
                            <div key={item.tempId} className="p-3 rounded-2xl bg-stone-50/90 border border-stone-200/70 space-y-2">
                              <div className="flex items-center gap-2">
                                <input
                                  type="text"
                                  value={item.name}
                                  onChange={(e) => handleUpdateParsedItem(item.tempId, 'name', e.target.value)}
                                  className="flex-1 min-w-[120px] px-3 py-1.5 rounded-xl bg-white border border-stone-200 text-xs font-extrabold text-slate-900"
                                />
                                {item.bundleApplied && (
                                  <span className="text-[10px] font-extrabold px-2 py-1 rounded-lg bg-indigo-100 text-indigo-700 shrink-0">
                                    번들 {item.bundleApplied}입 반영
                                  </span>
                                )}
                                <button onClick={() => handleRemoveParsedItem(item.tempId)} className="p-1.5 rounded-xl text-slate-400 hover:text-rose-600">
                                  <Icon name="x" className="w-4 h-4" />
                                </button>
                              </div>
                              {item.originalName && (
                                <p className="text-[10px] text-slate-400 px-1">
                                  영수증 원본: {item.originalName} → 표준 식재료명 치환됨
                                </p>
                              )}

                              <div className="flex flex-wrap items-center gap-1.5">
                                <select
                                  value={item.category}
                                  onChange={(e) => handleUpdateParsedItem(item.tempId, 'category', e.target.value)}
                                  className="px-2.5 py-1.5 rounded-xl bg-white border border-stone-200 text-[11px] font-bold text-slate-700"
                                >
                                  {['채소/과일', '정육/수산', '유제품/계란', '냉동/가공', '곡류/기타'].map((c) => (
                                    <option key={c} value={c}>{c}</option>
                                  ))}
                                </select>

                                <div className="flex items-center gap-1 bg-white px-2 py-1 rounded-xl border border-stone-200">
                                  <input
                                    type="number"
                                    step="any"
                                    value={item.quantity}
                                    onChange={(e) => handleUpdateParsedItem(item.tempId, 'quantity', Number(e.target.value))}
                                    className="w-14 text-xs font-extrabold text-right text-slate-900 focus:outline-none"
                                  />
                                  <select
                                    value={item.unit}
                                    onChange={(e) => handleUpdateParsedItem(item.tempId, 'unit', e.target.value)}
                                    className="text-[11px] font-bold text-slate-600 bg-transparent focus:outline-none"
                                  >
                                    {['개', 'g', 'ml', '모', '구', '봉', '팩', '송이', '단', '장'].map((u) => (
                                      <option key={u} value={u}>{u}</option>
                                    ))}
                                  </select>
                                </div>

                                <div className="inline-flex items-center gap-1">
                                  {[2, 4, 5, 6].map((mult) => (
                                    <button
                                      key={mult}
                                      type="button"
                                      onClick={() =>
                                        handleUpdateParsedItem(
                                          item.tempId,
                                          'quantity',
                                          Number(((Number(item.quantity) || 1) * mult).toFixed(2))
                                        )
                                      }
                                      className="px-1.5 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[10px] font-extrabold"
                                    >
                                      ×{mult}
                                    </button>
                                  ))}
                                </div>

                                <div className="flex items-center gap-1 bg-white px-2.5 py-1.5 rounded-xl border border-stone-200 ml-auto">
                                  <span className="text-[11px] font-bold text-amber-600">D-</span>
                                  <input
                                    type="number"
                                    min="1"
                                    value={item.estimatedExpiryDays}
                                    onChange={(e) => handleUpdateParsedItem(item.tempId, 'estimatedExpiryDays', Number(e.target.value))}
                                    className="w-9 text-xs font-extrabold text-slate-900 focus:outline-none"
                                  />
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* VIEW 3: 식단 전체 보기 ('식단') */}
                {activeTab === 'meals' && (
                  <div className="space-y-3.5">
                    {meals
                      .filter((meal) => meal.type !== '간식' && !(shouldSkipLunch && meal.type === '점심'))
                      .map((meal) => {
                        const isDone = !!completedMeals[meal.type];
                        const mealCfg = familyProfile.mealConfig?.[meal.type];
                        const activeStyle = meal.mealStyle || mealCfg?.style;
                        const activeConds = meal.appliedConditions || mealCfg?.conditions || [];
                        const menuLines = formatMealLines(meal.title);
                        const badgeColors = {
                          아침: 'bg-amber-500 text-white',
                          점심: 'bg-emerald-600 text-white',
                          저녁: 'bg-indigo-600 text-white'
                        };

                        return (
                          <div
                            key={meal.type}
                            onClick={() => setSelectedRecipeMeal(meal)}
                            className={`group cursor-pointer bg-white/95 rounded-2xl border px-5 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition-all ${
                              isDone ? 'border-emerald-300 bg-emerald-50/30' : 'border-white shadow-sm hover:border-orange-200'
                            }`}
                          >
                            <div className="min-w-0 flex-1 space-y-2">
                              <div className="flex flex-wrap items-center gap-1.5">
                                <span className={`text-xs font-extrabold px-2.5 py-0.5 rounded-lg ${badgeColors[meal.type] || 'bg-slate-800 text-white'}`}>
                                  {meal.type}
                                </span>
                                {activeStyle && (
                                  <span className="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-stone-100 text-slate-700 border border-stone-200/70">
                                    {activeStyle}
                                  </span>
                                )}
                                {activeConds.map((c) => (
                                  <span key={c} className="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-rose-50 text-rose-700 border border-rose-200/70">
                                    {c === '과일 필수' && meal.includedFruit ? meal.includedFruit : c}
                                  </span>
                                ))}
                              </div>

                              {/* 메뉴 한 줄씩 세로 나열 + 개별 반찬/국 별표(☆/★) 저장 */}
                              <div className="space-y-1">
                                {menuLines.map((line, lIdx) => {
                                  const canStar = isStarEligibleDish(line);
                                  const starred = canStar && isDishFavorited(line);
                                  return (
                                    <div key={lIdx} className="flex items-center gap-2">
                                      <p className="text-sm sm:text-[15px] font-bold text-slate-900 leading-snug group-hover:text-orange-600 transition-colors">
                                        {line}
                                      </p>
                                      {canStar && (
                                        <button
                                          type="button"
                                          onClick={(e) => {
                                            e.stopPropagation();
                                            handleToggleFavoriteDish(line, meal);
                                          }}
                                          title={starred ? `'${line}' 최애 해제` : `'${line}' 최애메뉴 저장`}
                                          className={`w-6 h-6 rounded-md flex items-center justify-center text-base transition-colors ${
                                            starred
                                              ? 'bg-amber-50 text-amber-500 border border-amber-200'
                                              : 'text-stone-300 hover:text-amber-500 hover:bg-amber-50'
                                          }`}
                                        >
                                          {starred ? '★' : '☆'}
                                        </button>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>

                              {meal.title.includes('3찬') && (
                                <div onClick={(e) => e.stopPropagation()} className="flex flex-wrap items-center gap-1.5 pt-0.5">
                                  <button
                                    type="button"
                                    onClick={() => handleRerollSingleBanchan(meal.type)}
                                    className="px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-orange-50 text-slate-600 hover:text-orange-700 border border-stone-200/80 text-[11px] font-extrabold transition-colors"
                                  >
                                    반찬 1개 교체
                                  </button>
                                  {selectedDayOffset < 2 && (
                                    <button
                                      type="button"
                                      onClick={() => handleCarryOver3ChanToTomorrow(meal)}
                                      className="px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-orange-50 text-slate-600 hover:text-orange-700 border border-stone-200/80 text-[11px] font-extrabold transition-colors"
                                    >
                                      {selectedDayOffset === 0 ? '내일도 이어 먹기' : '모레도 이어 먹기'}
                                    </button>
                                  )}
                                </div>
                              )}

                              <div className="flex flex-wrap items-center gap-1.5 pt-0.5">
                                <span className="text-[11px] font-bold text-slate-400">사용 재료:</span>
                                {meal.ingredientsUsed.map((ing, i) => (
                                  <span key={i} className="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-stone-100 text-slate-700">
                                    {ing.name} {ing.amount}{ing.unit}
                                  </span>
                                ))}
                              </div>
                            </div>

                            <div className="flex items-center gap-2 shrink-0 self-end sm:self-center">
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setSelectedRecipeMeal(meal);
                                }}
                                className="px-3.5 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 font-bold text-xs whitespace-nowrap transition-colors"
                              >
                                레시피
                              </button>
                              {isDone ? (
                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    handleUndoCompleteMeal(meal);
                                  }}
                                  className="px-3.5 py-2 rounded-xl font-extrabold text-xs whitespace-nowrap bg-emerald-100 hover:bg-rose-50 text-emerald-800 hover:text-rose-700 transition-colors"
                                >
                                  ✓ 완료됨 · 되돌리기
                                </button>
                              ) : (
                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    handleOpenCompleteMealModal(meal);
                                  }}
                                  className="px-4 py-2 rounded-xl font-extrabold text-xs whitespace-nowrap bg-slate-900 hover:bg-slate-800 text-white transition-colors"
                                >
                                  요리 완료
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                  </div>
                )}

                {/* VIEW 4: 우리집 최애메뉴 모아보기 ('favorites') */}
                {activeTab === 'favorites' && (
                  <div className="space-y-4">
                    <div className="bg-white/95 rounded-3xl px-5 py-4 border border-white shadow-sm flex flex-wrap items-center justify-between gap-3">
                      <div>
                        <h2 className="text-base font-extrabold text-slate-900">
                          우리 집 최애 반찬 · 국 모아보기 ({favoriteMeals.length}개)
                        </h2>
                        <p className="text-xs text-slate-500 mt-0.5">
                          식단 탭에서 별표(☆)로 저장한 반찬·국을 오늘·내일·모레 식단에 바로 반영할 수 있습니다.
                        </p>
                      </div>
                    </div>

                    {favoriteMeals.length === 0 ? (
                      <div className="bg-white/95 rounded-3xl p-12 text-center border border-white shadow-sm space-y-2">
                        <p className="text-2xl text-amber-500">☆</p>
                        <p className="text-sm font-extrabold text-slate-700">
                          아직 저장된 최애 반찬·국이 없습니다.
                        </p>
                        <p className="text-xs text-slate-400">
                          [식단] 탭에서 마음에 드는 반찬이나 국 옆의 별표(☆)를 눌러 추가해 보세요.
                        </p>
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {favoriteMeals.map((fav) => {
                          const dishName = fav.dishName || fav.title;
                          const kind = fav.dishKind || classifyDishKind(dishName);
                          return (
                            <div
                              key={fav.id}
                              className="bg-white/95 rounded-3xl border border-white shadow-sm p-5 flex flex-col justify-between gap-4"
                            >
                              <div className="space-y-2">
                                <div className="flex items-center justify-between gap-2">
                                  <span className="text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg bg-amber-100 text-amber-900">
                                    ★ 최애 {kind}
                                  </span>
                                  <button
                                    type="button"
                                    onClick={() => handleToggleFavoriteDish(dishName, fav)}
                                    className="text-xs font-bold text-slate-400 hover:text-rose-600 px-2 py-1 rounded-lg hover:bg-rose-50"
                                  >
                                    해제
                                  </button>
                                </div>

                                <h3 className="text-base font-extrabold text-slate-900 leading-snug">
                                  {dishName}
                                </h3>
                              </div>

                              <div className="grid grid-cols-3 gap-1.5 pt-2 border-t border-stone-100">
                                <button
                                  type="button"
                                  onClick={() => handleApplyFavoriteDishToDay(fav, 0)}
                                  className="py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs transition-colors"
                                >
                                  오늘 반영
                                </button>
                                <button
                                  type="button"
                                  onClick={() => handleApplyFavoriteDishToDay(fav, 1)}
                                  className="py-2 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-800 font-extrabold text-xs transition-colors"
                                >
                                  내일 반영
                                </button>
                                <button
                                  type="button"
                                  onClick={() => handleApplyFavoriteDishToDay(fav, 2)}
                                  className="py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 font-extrabold text-xs transition-colors"
                                >
                                  모레 반영
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* 오픈소스 저작권 및 라이선스 푸터 */}
              <footer className="mt-10 pt-5 pb-3 border-t border-stone-200/80 flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-slate-400">
                <div className="flex items-center gap-2 flex-wrap justify-center sm:justify-start">
                  <span className="font-bold text-slate-500">
                    © {new Date().getFullYear()} {OPEN_SOURCE_AUTHOR}.
                  </span>
                  <span>All rights reserved.</span>
                  <span className="px-2 py-0.5 rounded-md bg-stone-200/70 text-slate-600 font-extrabold text-[10px]">
                    MIT License
                  </span>
                </div>
                <div className="flex items-center gap-3">
                  <span>Open Source Family Fridge &amp; Meal Planner</span>
                  {OPEN_SOURCE_REPO_URL && (
                    <a
                      href={OPEN_SOURCE_REPO_URL}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="font-bold text-slate-500 hover:text-slate-800 underline"
                    >
                      GitHub
                    </a>
                  )}
                </div>
              </footer>
            </main>
          </div>

          {/* 레시피 탐색 모달 */}
          {selectedRecipeMeal && (
            <div onClick={() => setSelectedRecipeMeal(null)} className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-5">
                <div className="flex items-start justify-between gap-3">
                  <div>
                    <span className="text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg bg-orange-100 text-orange-800">{selectedRecipeMeal.type} 레시피 검색</span>
                    <div className="mt-1.5 space-y-0.5">
                      {formatMealLines(selectedRecipeMeal.title).map((line, lIdx) => (
                        <p key={lIdx} className="text-base font-extrabold text-slate-900 leading-snug">
                          {line}
                        </p>
                      ))}
                    </div>
                  </div>
                  <button onClick={() => setSelectedRecipeMeal(null)} className="p-1.5 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-2.5">
                  <a
                    href={`https://www.youtube.com/results?search_query=${encodeURIComponent((selectedRecipeMeal.recipeQuery || selectedRecipeMeal.title) + ' #shorts')}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex items-center justify-between p-4 rounded-2xl bg-gradient-to-r from-rose-500 to-red-600 text-white shadow-md"
                  >
                    <div>
                      <p className="text-sm font-extrabold">유튜브 쇼츠 (1분 컷 레시피)</p>
                      <p className="text-[11px] text-rose-100">짧고 직관적인 세로 영상으로 빠르게 따라 만들기</p>
                    </div>
                    <Icon name="external" className="w-4 h-4" />
                  </a>

                  <a
                    href={`https://www.youtube.com/results?search_query=${encodeURIComponent(selectedRecipeMeal.recipeQuery || selectedRecipeMeal.title)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex items-center justify-between p-4 rounded-2xl bg-slate-900 text-white"
                  >
                    <div>
                      <p className="text-sm font-extrabold">유튜브 상세 요리 영상</p>
                      <p className="text-[11px] text-slate-300">계량부터 불 조절까지 친절한 영상 레시피 보기</p>
                    </div>
                    <Icon name="external" className="w-4 h-4" />
                  </a>

                  <a
                    href={`https://search.naver.com/search.naver?where=view&query=${encodeURIComponent(selectedRecipeMeal.recipeQuery || selectedRecipeMeal.title)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex items-center justify-between p-4 rounded-2xl bg-emerald-50 text-emerald-950 border border-emerald-200"
                  >
                    <div>
                      <p className="text-sm font-extrabold">블로그 사진·글 레시피</p>
                      <p className="text-[11px] text-emerald-700">주방에서 화면 띄워놓고 단계별 사진으로 보며 조리하기</p>
                    </div>
                    <Icon name="external" className="w-4 h-4 text-emerald-700" />
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* 설정 모달 */}
          {isSettingsModalOpen && (
            <div onClick={() => setIsSettingsModalOpen(false)} className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-slate-900">우리집 맞춤 &amp; 오픈소스 설정</h3>
                  <button onClick={() => setIsSettingsModalOpen(false)} className="p-1.5 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* 1. 냉장고 이름 & 홈 화면 옵션 & 아이별 프로필 */}
                <div className="bg-stone-50 p-4 rounded-2xl border border-stone-200/80 space-y-3.5">
                  <p className="text-xs font-extrabold text-slate-800">1. 우리 집 냉장고 이름 &amp; 아이별 맞춤 설정</p>

                  <div>
                    <label className="text-[11px] font-bold text-slate-500 block mb-1">냉장고 애칭</label>
                    <input
                      type="text"
                      value={familyProfile.householdName}
                      onChange={(e) => setFamilyProfile({ ...familyProfile, householdName: e.target.value })}
                      placeholder="예: 민준·서아네 냉장고"
                      className="w-full px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs font-bold"
                    />
                  </div>

                  <div className="flex items-center justify-between p-3 rounded-xl bg-white border border-stone-200">
                    <div>
                      <p className="text-xs font-extrabold text-slate-900">홈 화면 '오늘의 우리 아이 액자'</p>
                      <p className="text-[10px] text-slate-400">원치 않으시면 숨기고 3일치 식단표만 표시할 수 있습니다.</p>
                    </div>
                    <button
                      type="button"
                      onClick={() =>
                        setFamilyProfile({
                          ...familyProfile,
                          showKidsPhotoFrame: familyProfile.showKidsPhotoFrame === false ? true : false
                        })
                      }
                      className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition-colors ${
                        familyProfile.showKidsPhotoFrame !== false
                          ? 'bg-emerald-600 text-white'
                          : 'bg-stone-200 text-slate-600'
                      }`}
                    >
                      {familyProfile.showKidsPhotoFrame !== false ? '표시함' : '숨김'}
                    </button>
                  </div>

                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="text-[11px] font-bold text-slate-500">아이 목록 ({(familyProfile.kids || []).length}명)</label>
                      <button
                        type="button"
                        onClick={() =>
                          setFamilyProfile({
                            ...familyProfile,
                            kids: [
                              ...(familyProfile.kids || []),
                              {
                                id: `kid-${Date.now()}`,
                                nickname: `${(familyProfile.kids || []).length + 1}째`,
                                birthYearMonth: '2023-05',
                                mealStage: '어린이 일반식',
                                attendsInstitution: true
                              }
                            ]
                          })
                        }
                        className="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-[11px] font-extrabold"
                      >
                        + 아이 추가
                      </button>
                    </div>

                    {(familyProfile.kids || []).map((kid, idx) => (
                      <div key={kid.id || idx} className="p-3 rounded-xl bg-white border border-stone-200 space-y-2">
                        <div className="flex items-center gap-2">
                          <input
                            type="text"
                            value={kid.nickname}
                            onChange={(e) => {
                              const next = [...familyProfile.kids];
                              next[idx] = { ...kid, nickname: e.target.value };
                              setFamilyProfile({ ...familyProfile, kids: next });
                            }}
                            placeholder="애칭 (예: 첫째)"
                            className="w-24 px-2.5 py-1.5 rounded-lg bg-stone-50 border border-stone-200 text-xs font-extrabold"
                          />
                          <input
                            type="month"
                            value={kid.birthYearMonth}
                            onChange={(e) => {
                              const next = [...familyProfile.kids];
                              next[idx] = { ...kid, birthYearMonth: e.target.value };
                              setFamilyProfile({ ...familyProfile, kids: next });
                            }}
                            className="flex-1 px-2.5 py-1.5 rounded-lg bg-stone-50 border border-stone-200 text-xs font-bold"
                          />
                          <span className="text-[11px] font-extrabold px-2 py-1 rounded-lg bg-sky-50 text-sky-700 shrink-0">
                            {formatKidAgeLabel(kid.birthYearMonth)}
                          </span>
                          <button
                            type="button"
                            onClick={() =>
                              setFamilyProfile({
                                ...familyProfile,
                                kids: familyProfile.kids.filter((_, i) => i !== idx)
                              })
                            }
                            className="p-1 text-slate-400 hover:text-rose-600"
                          >
                            <Icon name="x" className="w-4 h-4" />
                          </button>
                        </div>

                        <div className="flex flex-wrap gap-1.5">
                          {['이유식', '저염 유아식', '어린이 일반식', '어른과 동일'].map((stage) => (
                            <button
                              key={stage}
                              type="button"
                              onClick={() => {
                                const next = [...familyProfile.kids];
                                next[idx] = { ...kid, mealStage: stage };
                                setFamilyProfile({ ...familyProfile, kids: next });
                              }}
                              className={`px-2 py-1 rounded-lg text-[10px] font-extrabold ${
                                kid.mealStage === stage ? 'bg-slate-900 text-white' : 'bg-stone-100 text-slate-600'
                              }`}
                            >
                              {stage}
                            </button>
                          ))}
                        </div>

                        <div className="pt-1 flex items-center justify-between gap-2 border-t border-stone-100">
                          <span className="text-[10px] font-bold text-slate-400">평일 점심 생활:</span>
                          <div className="inline-flex gap-1">
                            <button
                              type="button"
                              onClick={() => {
                                const next = [...familyProfile.kids];
                                next[idx] = { ...kid, attendsInstitution: true };
                                setFamilyProfile({ ...familyProfile, kids: next });
                              }}
                              className={`px-2 py-1 rounded-lg text-[10px] font-extrabold ${
                                kid.attendsInstitution !== false ? 'bg-emerald-600 text-white' : 'bg-stone-100 text-slate-600'
                              }`}
                            >
                              기관 등원 (급식)
                            </button>
                            <button
                              type="button"
                              onClick={() => {
                                const next = [...familyProfile.kids];
                                next[idx] = { ...kid, attendsInstitution: false };
                                setFamilyProfile({ ...familyProfile, kids: next });
                              }}
                              className={`px-2 py-1 rounded-lg text-[10px] font-extrabold ${
                                kid.attendsInstitution === false ? 'bg-orange-500 text-white' : 'bg-stone-100 text-slate-600'
                              }`}
                            >
                              가정 보육 (집밥)
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* 알레르기 선택 */}
                  <div className="space-y-1.5">
                    <label className="text-[11px] font-bold text-slate-500 block">제외할 알레르기 식재료</label>
                    <div className="flex flex-wrap gap-1.5">
                      {['계란', '우유', '땅콩/견과류', '밀가루', '대두(콩)', '새우/갑각류', '복숭아'].map((al) => {
                        const active = (familyProfile.allergies || []).includes(al);
                        return (
                          <button
                            key={al}
                            type="button"
                            onClick={() => {
                              const prev = familyProfile.allergies || [];
                              const next = active ? prev.filter((x) => x !== al) : [...prev, al];
                              setFamilyProfile({ ...familyProfile, allergies: next });
                            }}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-extrabold ${
                              active ? 'bg-rose-600 text-white' : 'bg-white border border-stone-200 text-slate-600'
                            }`}
                          >
                            {active ? `✓ ${al}` : al}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* 2. 끼니별(아침/점심/저녁) 스타일 & 선호 조건 */}
                <div className="bg-amber-50/70 p-4 rounded-2xl border border-amber-200/80 space-y-3">
                  <p className="text-xs font-extrabold text-amber-950">2. 끼니별 식단 스타일 &amp; 선호 조건</p>
                  {['아침', '점심', '저녁'].map((mealType) => {
                    const currentCfg = familyProfile.mealConfig?.[mealType] || DEFAULT_MEAL_CONFIG[mealType];
                    return (
                      <div key={mealType} className="p-3 rounded-xl bg-white border border-amber-200/70 space-y-2">
                        <div className="flex items-center justify-between gap-2">
                          <span className="text-xs font-extrabold text-slate-900">{mealType}</span>
                          <div className="inline-flex bg-stone-100 p-0.5 rounded-lg">
                            {MEAL_STYLE_OPTIONS.map((st) => (
                              <button
                                key={st}
                                type="button"
                                onClick={() =>
                                  setFamilyProfile({
                                    ...familyProfile,
                                    mealConfig: {
                                      ...familyProfile.mealConfig,
                                      [mealType]: { ...currentCfg, style: st }
                                    }
                                  })
                                }
                                className={`px-2.5 py-1 rounded-md text-[11px] font-extrabold ${
                                  currentCfg.style === st ? 'bg-amber-600 text-white shadow-sm' : 'text-slate-600'
                                }`}
                              >
                                {st}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="flex flex-wrap gap-1.5">
                          {MEAL_CONDITION_OPTIONS.map((cond) => {
                            const active = (currentCfg.conditions || []).includes(cond);
                            return (
                              <button
                                key={cond}
                                type="button"
                                onClick={() => {
                                  const prevConds = currentCfg.conditions || [];
                                  const nextConds = active
                                    ? prevConds.filter((x) => x !== cond)
                                    : [...prevConds, cond];
                                  setFamilyProfile({
                                    ...familyProfile,
                                    mealConfig: {
                                      ...familyProfile.mealConfig,
                                      [mealType]: { ...currentCfg, conditions: nextConds }
                                    }
                                  });
                                }}
                                className={`px-2 py-1 rounded-lg text-[10px] font-extrabold ${
                                  active ? 'bg-slate-900 text-white' : 'bg-stone-100 text-slate-600'
                                }`}
                              >
                                {active ? `✓ ${cond}` : cond}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* 3. 가족 실시간 동기화 & Gemini AI 키 */}
                <div className="bg-indigo-50/70 p-4 rounded-2xl border border-indigo-200/70 space-y-2.5">
                  <p className="text-xs font-extrabold text-indigo-950">3. 부부 공유 저장소(npoint.io) &amp; AI 키 (선택)</p>
                  <input
                    type="url"
                    value={cloudUrlInput}
                    onChange={(e) => setCloudUrlInput(e.target.value)}
                    placeholder="https://api.npoint.io/본인저장소ID"
                    className="w-full bg-white px-3 py-2 rounded-xl border border-indigo-200 text-xs font-mono"
                  />
                  <input
                    type="password"
                    value={geminiApiKey}
                    onChange={(e) => setGeminiApiKey(e.target.value)}
                    placeholder="Gemini API 키 (AIzaSy...)"
                    className="w-full bg-white px-3 py-2 rounded-xl border border-indigo-200 text-xs"
                  />
                </div>

                <button
                  type="button"
                  onClick={() => {
                    const cleanUrl = cloudUrlInput.trim();
                    setCloudUrl(cleanUrl);
                    try {
                      if (cleanUrl) localStorage.setItem('skf_custom_npoint_url', cleanUrl);
                      else localStorage.removeItem('skf_custom_npoint_url');
                      localStorage.setItem('skf_gemini_key', geminiApiKey.trim());
                    } catch {}
                    saveAndSync({
                      familyProfile,
                      inventory,
                      logs: consumptionLogs,
                      mealsByOffset,
                      completedMealsByOffset,
                      geminiApiKey: geminiApiKey.trim(),
                      cloudUrl: cleanUrl
                    });
                    setIsSettingsModalOpen(false);
                    showToast('모든 설정이 저장되었습니다.');
                  }}
                  className="w-full py-3 rounded-2xl bg-slate-900 text-white font-extrabold text-sm"
                >
                  저장 및 닫기
                </button>
              </div>
            </div>
          )}

          {/* 요리 완료 실제 사용 수량 확인 모달 */}
          {cookingConfirmModal && (
            <div onClick={() => setCookingConfirmModal(null)} className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <span className="text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg bg-emerald-50 text-emerald-700">
                      {cookingConfirmModal.meal.type} 요리 완료 · 재고 차감 확인
                    </span>
                    <h3 className="text-base font-extrabold text-slate-900 mt-1.5">
                      실제로 사용한 재료 수량을 확인해 주세요
                    </h3>
                    <p className="text-[11px] text-slate-500 mt-0.5">
                      더 쓰거나 덜 쓴 재료는 수량을 직접 수정할 수 있습니다. (0이면 차감 안 됨)
                    </p>
                  </div>
                  <button onClick={() => setCookingConfirmModal(null)} className="p-1.5 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {cookingConfirmModal.items.length === 0 ? (
                  <div className="p-4 rounded-2xl bg-stone-50 text-center text-xs font-semibold text-slate-500">
                    차감할 냉장고 재고 품목이 없습니다. 바로 완료 처리할까요?
                  </div>
                ) : (
                  <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                    {cookingConfirmModal.items.map((item, idx) => {
                      const step = item.unit === 'g' || item.unit === 'ml' ? 50 : 0.5;
                      return (
                        <div key={item.key} className="p-3 rounded-2xl bg-stone-50 border border-stone-200/70 flex items-center justify-between gap-2">
                          <div className="min-w-0">
                            <p className="text-xs font-extrabold text-slate-900 truncate">{item.name}</p>
                            <p className="text-[10px] font-semibold text-slate-500 mt-0.5">
                              현재 보유량: {item.currentStock}{item.unit}
                            </p>
                          </div>

                          <div className="flex items-center gap-1.5 shrink-0">
                            <button
                              type="button"
                              onClick={() => {
                                const nextAmt = Math.max(0, Number((Number(item.amount) - step).toFixed(2)));
                                const nextItems = [...cookingConfirmModal.items];
                                nextItems[idx] = { ...item, amount: nextAmt };
                                setCookingConfirmModal({ ...cookingConfirmModal, items: nextItems });
                              }}
                              className="w-7 h-7 rounded-lg bg-white hover:bg-rose-50 border border-stone-200 text-slate-800 font-extrabold text-xs"
                            >
                              -
                            </button>
                            <div className="flex items-center bg-white px-2 py-1 rounded-lg border border-stone-200">
                              <input
                                type="number"
                                step="any"
                                min="0"
                                max={item.currentStock || undefined}
                                value={item.amount}
                                onChange={(e) => {
                                  const rawVal = Math.max(0, Number(e.target.value) || 0);
                                  const clamped = item.currentStock > 0 ? Math.min(item.currentStock, rawVal) : rawVal;
                                  const nextItems = [...cookingConfirmModal.items];
                                  nextItems[idx] = { ...item, amount: clamped };
                                  setCookingConfirmModal({ ...cookingConfirmModal, items: nextItems });
                                }}
                                className="w-12 text-xs font-extrabold text-right text-slate-900 focus:outline-none"
                              />
                              <span className="text-[11px] font-bold text-slate-500 ml-1">{item.unit}</span>
                            </div>
                            <button
                              type="button"
                              onClick={() => {
                                const rawVal = Number((Number(item.amount) + step).toFixed(2));
                                const clamped = item.currentStock > 0 ? Math.min(item.currentStock, rawVal) : rawVal;
                                const nextItems = [...cookingConfirmModal.items];
                                nextItems[idx] = { ...item, amount: clamped };
                                setCookingConfirmModal({ ...cookingConfirmModal, items: nextItems });
                              }}
                              className="w-7 h-7 rounded-lg bg-white hover:bg-emerald-50 border border-stone-200 text-slate-800 font-extrabold text-xs"
                            >
                              +
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                <div className="pt-1 flex gap-2">
                  <button
                    type="button"
                    onClick={() => setCookingConfirmModal(null)}
                    className="flex-1 py-2.5 rounded-2xl bg-stone-100 text-slate-600 font-bold text-sm"
                  >
                    취소
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmCompleteMeal}
                    className="flex-1 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm"
                  >
                    ✓ 차감 및 완료 확정
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 아이 사진 크게 보기 모달 */}
          {zoomedPhoto && (
            <div onClick={() => setZoomedPhoto(null)} className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className="relative max-w-lg w-full bg-white rounded-3xl p-2 shadow-2xl">
                <img src={zoomedPhoto.dataUrl} alt="아이 사진 확대" className="w-full max-h-[75vh] object-contain rounded-2xl bg-stone-100" />
                <button
                  type="button"
                  onClick={() => setZoomedPhoto(null)}
                  className="absolute top-4 right-4 p-2 rounded-xl bg-black/65 text-white hover:bg-black"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>
            </div>
          )}

          {/* 우리 아이 앨범 관리 모달 */}
          {isPhotoManagerOpen && (
            <div onClick={() => setIsPhotoManagerOpen(false)} className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h3 className="text-base font-extrabold text-slate-900">우리 아이 액자 앨범 ({kidsPhotos.length}/24장)</h3>
                    <p className="text-[11px] text-slate-500">얼굴 중심 자동 확대(ON) 또는 원본 비율을 사진별로 설정할 수 있습니다.</p>
                  </div>
                  <button onClick={() => setIsPhotoManagerOpen(false)} className="p-1.5 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-72 overflow-y-auto pr-1">
                  {kidsPhotos.map((p) => {
                    const focus = p.faceFocus || { x: 50, y: 26, detected: false };
                    const isZoomOn = p.zoomEnabled !== false;
                    return (
                      <div key={p.id} className="relative aspect-square rounded-2xl overflow-hidden border border-stone-200 bg-stone-100">
                        <img
                          src={p.dataUrl}
                          alt="앨범 사진"
                          style={
                            isZoomOn
                              ? {
                                  objectPosition: `${focus.x}% ${focus.y}%`,
                                  transformOrigin: `${focus.x}% ${focus.y}%`
                                }
                              : undefined
                          }
                          className={`w-full h-full object-cover transition-transform ${isZoomOn ? 'scale-[1.35]' : ''}`}
                        />
                        <button
                          type="button"
                          onClick={() => handleTogglePhotoFaceZoom(p.id)}
                          className={`absolute bottom-1.5 left-1.5 px-2 py-0.5 rounded-lg text-[10px] font-extrabold shadow-xs ${
                            isZoomOn
                              ? 'bg-emerald-600 text-white'
                              : 'bg-white/90 text-slate-800'
                          }`}
                        >
                          {isZoomOn ? '얼굴확대 ON' : '원본'}
                        </button>
                        <button
                          type="button"
                          onClick={() => handleRemoveKidsPhoto(p.id)}
                          title="사진 삭제"
                          className="absolute top-1.5 right-1.5 p-1 rounded-lg bg-rose-600 text-white hover:bg-rose-700"
                        >
                          <Icon name="trash" className="w-3 h-3" />
                        </button>
                      </div>
                    );
                  })}
                </div>

                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => kidsPhotoInputRef.current?.click()}
                    className="flex-1 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs"
                  >
                    + 사진 더 추가하기
                  </button>
                  <button
                    type="button"
                    onClick={() => setIsPhotoManagerOpen(false)}
                    className="px-5 py-2.5 rounded-2xl bg-stone-100 text-slate-700 font-extrabold text-xs"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 식자재 직접 추가 모달 */}
          {isAddModalOpen && (
            <div onClick={() => setIsAddModalOpen(false)} className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-slate-900">식자재 직접 추가</h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="p-1.5 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleAddManualItem} className="space-y-3.5">
                  <div>
                    <label className="text-xs font-bold text-slate-600 block mb-1">식재료 이름</label>
                    <input type="text" required value={newItem.name} onChange={(e) => setNewItem({ ...newItem, name: e.target.value })} placeholder="예: 무농약 양파, 어린이 치즈" className="w-full px-3.5 py-2.5 rounded-2xl border border-stone-200 text-sm" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">카테고리</label>
                      <select value={newItem.category} onChange={(e) => setNewItem({ ...newItem, category: e.target.value })} className="w-full px-3 py-2.5 rounded-2xl border border-stone-200 text-sm bg-white">
                        {['채소/과일', '정육/수산', '유제품/계란', '냉동/가공', '곡류/기타'].map((c) => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">남은 소비기한 (일)</label>
                      <input type="number" min="1" required value={newItem.daysLeft} onChange={(e) => setNewItem({ ...newItem, daysLeft: e.target.value })} className="w-full px-3.5 py-2.5 rounded-2xl border border-stone-200 text-sm" />
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2.5">
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">수량</label>
                      <input type="number" step="any" min="0.1" required value={newItem.quantity} onChange={(e) => setNewItem({ ...newItem, quantity: e.target.value })} className="w-full px-3.5 py-2.5 rounded-2xl border border-stone-200 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">단위</label>
                      <select value={newItem.unit} onChange={(e) => setNewItem({ ...newItem, unit: e.target.value })} className="w-full px-2.5 py-2.5 rounded-2xl border border-stone-200 text-sm bg-white">
                        {['개', 'g', 'ml', '모', '구', '봉', '팩', '송이', '단', '장'].map((u) => <option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">보관</label>
                      <select value={newItem.storage} onChange={(e) => setNewItem({ ...newItem, storage: e.target.value })} className="w-full px-2.5 py-2.5 rounded-2xl border border-stone-200 text-sm bg-white">
                        {['냉장', '냉동', '실온'].map((s) => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 font-bold text-sm">취소</button>
                    <button type="submit" className="flex-1 py-3 rounded-2xl bg-emerald-600 text-white font-extrabold text-sm">추가하기</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 식자재 정보 수정 모달 */}
          {editingItem && (
            <div onClick={() => setEditingItem(null)} className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-slate-900">식자재 정보 수정</h3>
                  <button onClick={() => setEditingItem(null)} className="p-1.5 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleUpdateInventoryItem} className="space-y-3.5">
                  <div>
                    <label className="text-xs font-bold text-slate-600 block mb-1">식재료 이름</label>
                    <input
                      type="text"
                      required
                      value={editingItem.name}
                      onChange={(e) => setEditingItem({ ...editingItem, name: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-2xl border border-stone-200 text-sm focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">카테고리</label>
                      <select
                        value={editingItem.category}
                        onChange={(e) => setEditingItem({ ...editingItem, category: e.target.value })}
                        className="w-full px-3 py-2.5 rounded-2xl border border-stone-200 text-sm bg-white"
                      >
                        {['채소/과일', '정육/수산', '유제품/계란', '냉동/가공', '곡류/기타'].map((c) => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">남은 소비기한 (일)</label>
                      <input
                        type="number"
                        min="0"
                        required
                        value={editingItem.daysLeft}
                        onChange={(e) => setEditingItem({ ...editingItem, daysLeft: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-2xl border border-stone-200 text-sm"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2.5">
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">수량</label>
                      <input
                        type="number"
                        step="any"
                        min="0.1"
                        required
                        value={editingItem.quantity}
                        onChange={(e) => setEditingItem({ ...editingItem, quantity: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-2xl border border-stone-200 text-sm"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">단위</label>
                      <select
                        value={editingItem.unit}
                        onChange={(e) => setEditingItem({ ...editingItem, unit: e.target.value })}
                        className="w-full px-2.5 py-2.5 rounded-2xl border border-stone-200 text-sm bg-white"
                      >
                        {['개', 'g', 'ml', '모', '구', '봉', '팩', '송이', '단', '장'].map((u) => (
                          <option key={u} value={u}>{u}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">보관</label>
                      <select
                        value={editingItem.storage || '냉장'}
                        onChange={(e) => setEditingItem({ ...editingItem, storage: e.target.value })}
                        className="w-full px-2.5 py-2.5 rounded-2xl border border-stone-200 text-sm bg-white"
                      >
                        {['냉장', '냉동', '실온'].map((s) => (
                          <option key={s} value={s}>{s}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setEditingItem(null)}
                      className="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 font-bold text-sm"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm"
                    >
                      수정 저장
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
