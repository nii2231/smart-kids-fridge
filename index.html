    function getTodayDateString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function applyDailyCountdown(invList, lastDateStr) {
      const todayStr = getTodayDateString();
      if (!lastDateStr || lastDateStr === todayStr) {
        return { updatedInventory: invList, elapsedDays: 0, todayStr };
      }
      const prevTime = new Date(lastDateStr + 'T00:00:00').getTime();
      const currTime = new Date(todayStr + 'T00:00:00').getTime();
      const diffDays = Math.floor((currTime - prevTime) / (1000 * 60 * 60 * 24));
      if (diffDays <= 0) {
        return { updatedInventory: invList, elapsedDays: 0, todayStr };
      }
      const updated = invList.map((item) => ({
        ...item,
        daysLeft: Math.max(0, Number(item.daysLeft) - diffDays)
      }));
      return { updatedInventory: updated, elapsedDays: diffDays, todayStr };
    }

    function formatKidAgeLabel(birthYearMonth) {
      if (!birthYearMonth || !birthYearMonth.includes('-')) return '';
      const [yStr, mStr] = birthYearMonth.split('-');
      const by = Number(yStr);
      const bm = Number(mStr);
      if (!by || !bm) return '';
      const now = new Date();
      const totalMonths = (now.getFullYear() - by) * 12 + (now.getMonth() + 1 - bm);
      if (totalMonths < 0) return '출생 예정';
      if (totalMonths <= 36) return `생후 ${totalMonths}개월`;
      const age = Math.floor(totalMonths / 12);
      return `만 ${age}세`;
    }

    function getTargetDateInfo(dayOffset = 0) {
      const target = new Date();
      target.setDate(target.getDate() + dayOffset);
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const dow = target.getDay();
      const isWeekend = dow === 0 || dow === 6;
      return {
        label: dayOffset === 0 ? '오늘' : dayOffset === 1 ? '내일' : '모레',
        dateStr: `${target.getMonth() + 1}/${target.getDate()}`,
        dayName: dayNames[dow],
        isWeekend
      };
    }

    function formatMealLines(title) {
      if (!title) return [];
      const banchanMatch = title.match(/^(.+?)\s*&\s*3찬\s*\((.+?)\)$/);
      if (banchanMatch) {
        const leftItems = banchanMatch[1].split('·').map((s) => s.trim()).filter(Boolean);
        const rightItems = banchanMatch[2].split('·').map((s) => s.trim()).filter(Boolean);
        return [...leftItems, ...rightItems];
      }
      if (title.includes('&')) {
        return title.split('&').map((s) => s.trim()).filter(Boolean);
      }
      if (title.includes('·')) {
        return title.split('·').map((s) => s.trim()).filter(Boolean);
      }
      return [title.trim()];
    }

    function isPlainRiceDish(dishName) {
      if (!dishName) return true;
      const clean = dishName.replace(/\s+/g, '');
      return /^(잡곡밥|쌀밥|백미밥|현미밥|흑미밥|보리밥|흰밥|밥)$/.test(clean);
    }

    function classifyDishKind(dishName) {
      if (!dishName) return '반찬';
      if (/(국|찌개|탕|전골)$/.test(dishName.trim())) return '국/찌개';
      if (/(볶음밥|덮밥|비빔밥|주먹밥|프렌치토스트|국수|파스타|우동)/.test(dishName)) return '한그릇 음식';
      return '반찬';
    }

    function compressKidPhotoFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = async () => {
            const maxDim = 480;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            let faceFocus = { x: 50, y: 26, detected: false };
            try {
              if ('FaceDetector' in window) {
                const detector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 2 });
                const faces = await detector.detect(canvas);
                if (Array.isArray(faces) && faces.length > 0) {
                  let minX = w, minY = h, maxX = 0, maxY = 0;
                  faces.forEach((f) => {
                    const b = f.boundingBox;
                    minX = Math.min(minX, b.x);
                    minY = Math.min(minY, b.y);
                    maxX = Math.max(maxX, b.x + b.width);
                    maxY = Math.max(maxY, b.y + b.height);
                  });
                  const centerX = ((minX + maxX) / 2 / w) * 100;
                  const centerY = ((minY + maxY) / 2 / h) * 100;
                  faceFocus = {
                    x: Math.max(15, Math.min(85, Math.round(centerX))),
                    y: Math.max(12, Math.min(82, Math.round(centerY))),
                    detected: true
                  };
                }
              }
            } catch {}

            resolve({
              dataUrl: canvas.toDataURL('image/jpeg', 0.68),
              faceFocus
            });
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      const dateInfos = useMemo(
        () => [todayInfo, tomorrowInfo, dayAfterTomorrowInfo],

        if (!Array.isArray(familyProfile.kids) || familyProfile.kids.length === 0) return false;
        return familyProfile.kids.some((k) => k.attendsInstitution === false);
      }, [familyProfile.kids]);

      const shouldSkipLunch = !activeDateInfo.isWeekend && !hasHomeCareKid;

      const saveAndSync = useCallback(
        async (nextState) => {
          const timestamp = Date.now();
          lastUpdatedAtRef.current = timestamp;
          const todayStr = getTodayDateString();

          const payload = {
            familyProfile: nextState.familyProfile !== undefined ? nextState.familyProfile : familyProfile,
            inventory: nextState.inventory,
            logs: nextState.logs,
            lastCheckedDate: todayStr,
            mealPlan: {
              mealsByOffset: nextState.mealsByOffset || mealsByOffset,
              completedMealsByOffset: nextState.completedMealsByOffset || completedMealsByOffset,
              deductedHistoryByOffset: nextState.deductedHistoryByOffset || deductedHistoryByOffset
            },
            favoriteMeals: nextState.favoriteMeals !== undefined ? nextState.favoriteMeals : favoriteMeals,
            kidsPhotos: nextState.kidsPhotos !== undefined ? nextState.kidsPhotos : kidsPhotos,
            geminiApiKey: nextState.geminiApiKey !== undefined ? nextState.geminiApiKey : geminiApiKey,
            updatedAt: timestamp
          };

          try {
            localStorage.setItem(storageKey, JSON.stringify(payload));
          } catch {}

          const targetUrl = nextState.cloudUrl !== undefined ? nextState.cloudUrl : cloudUrl;
          if (!targetUrl || !targetUrl.startsWith('http')) {
            setSyncStatus('local');
            setLastSyncedLabel('브라우저 자동 저장');
            return;
          }

          isPushingRef.current = true;
          setSyncStatus('syncing');
          try {
            const res = await fetch(targetUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('Cloud POST failed');
            setSyncStatus('synced');
            setLastSyncedLabel('방금 전');
          } catch {
            setSyncStatus('offline');
            setLastSyncedLabel('오프라인 백업');
          } finally {
            setTimeout(() => {
              isPushingRef.current = false;
            }, 600);
          }
        },
        [storageKey, familyProfile, geminiApiKey, cloudUrl, mealsByOffset, completedMealsByOffset, deductedHistoryByOffset, favoriteMeals, kidsPhotos]
      );

      const pullFromCloud = useCallback(
        async (isManual = false) => {
          if (!cloudUrl || !cloudUrl.startsWith('http')) {
            setSyncStatus('local');
            setLastSyncedLabel('브라우저 자동 저장');
            return;
          }
          if (isPushingRef.current) return;
          if (!isManual && (isAddModalOpen || (activeTab === 'receipt' && (receiptText.trim().length > 0 || receiptImageBase64)))) {
            return;
          }

          if (isManual) setSyncStatus('syncing');

          try {
            const res = await fetch(`${cloudUrl}?t=${Date.now()}`, {
              method: 'GET',
              cache: 'no-store'
            });
            if (!res.ok) throw new Error('Cloud GET failed');
            const remote = await res.json();

            if (!remote || typeof remote !== 'object' || !remote.updatedAt) {
              await saveAndSync({
                familyProfile,
                inventory,
                logs: consumptionLogs,
                mealsByOffset,
                completedMealsByOffset
              });
              return;
            }

            if (remote.updatedAt > lastUpdatedAtRef.current) {
              lastUpdatedAtRef.current = remote.updatedAt;
              if (remote.familyProfile) setFamilyProfile((prev) => ({ ...prev, ...remote.familyProfile }));
              if (Array.isArray(remote.inventory)) {
                const { updatedInventory } = applyDailyCountdown(remote.inventory, remote.lastCheckedDate);
                setInventory(updatedInventory);
              }
              if (Array.isArray(remote.logs)) setConsumptionLogs(remote.logs);
              if (remote.mealPlan?.mealsByOffset) setMealsByOffset(remote.mealPlan.mealsByOffset);
              if (remote.mealPlan?.completedMealsByOffset) setCompletedMealsByOffset(remote.mealPlan.completedMealsByOffset);
              if (remote.mealPlan?.deductedHistoryByOffset) setDeductedHistoryByOffset(remote.mealPlan.deductedHistoryByOffset);
              if (Array.isArray(remote.favoriteMeals)) setFavoriteMeals(remote.favoriteMeals);
              if (Array.isArray(remote.kidsPhotos)) setKidsPhotos(remote.kidsPhotos);
              if (remote.geminiApiKey) {
                setGeminiApiKey(remote.geminiApiKey);
                try { localStorage.setItem('skf_gemini_key', remote.geminiApiKey); } catch {}
              }
              try {
                localStorage.setItem(storageKey, JSON.stringify(remote));
              } catch {}
              if (isManual) showToast('공유 저장소에서 최신 데이터를 불러왔습니다!');
            } else if (isManual) {
              showToast('이미 최신 상태입니다!');
            }

            setSyncStatus('synced');
            const now = new Date();
            setLastSyncedLabel(
              `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`
            );
          } catch {
            setSyncStatus('offline');
            setLastSyncedLabel('오프라인 백업');
          }
        },
        [cloudUrl, isAddModalOpen, activeTab, receiptText, receiptImageBase64, familyProfile, inventory, consumptionLogs, mealsByOffset, completedMealsByOffset, saveAndSync, storageKey]

      useEffect(() => {
        if (!cloudUrl) {

      const handleConsume = (id, amountToSubtract, customNote = '직접 소진') => {
        let addedLog = null;
        const nextInventory = inventory
          .map((item) => {
            if (item.id !== id) return item;
            const actualUsed = Math.min(item.quantity, amountToSubtract);
            const nextQty = Number((item.quantity - actualUsed).toFixed(2));

            if (actualUsed > 0) {
              const now = new Date();
              const timeStr = `오늘 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
              addedLog = {
                id: `log-${Date.now()}-${Math.random()}`,
                name: item.name,
                amount: actualUsed,
                unit: item.unit,
                time: timeStr,
                note: customNote
              };
            }
            return { ...item, quantity: nextQty };
          })
          .filter((item) => item.quantity > 0);

        const nextLogs = addedLog ? [addedLog, ...consumptionLogs] : consumptionLogs;
        setInventory(nextInventory);
        if (addedLog) setConsumptionLogs(nextLogs);

        saveAndSync({
          inventory: nextInventory,
          logs: nextLogs,
          mealsByOffset,
          completedMealsByOffset
        });
      };

      const handleIncrease = (id, amountToAdd) => {
        const nextInventory = inventory.map((item) =>
          item.id === id ? { ...item, quantity: Number((item.quantity + amountToAdd).toFixed(2)) } : item

      };

      const handleDeleteAll = (item) => {
        handleConsume(item.id, item.quantity, '전량 소진');
        showToast(`'${item.name}' 재고를 모두 소진 처리했습니다.`);
      };

      const handleAddManualItem = (e) => {
        e.preventDefault();
        if (!newItem.name.trim()) return;
        const stdName = toStandardIngredientName(newItem.name);
        const existingIdx = inventory.findIndex(
          (i) => i.name.trim() === stdName && i.unit === newItem.unit
        );
        let nextInventory;
        if (existingIdx > -1) {
          nextInventory = [...inventory];
          nextInventory[existingIdx] = {
            ...nextInventory[existingIdx],
            quantity: Number((nextInventory[existingIdx].quantity + Number(newItem.quantity)).toFixed(2)),
            daysLeft: Math.min(nextInventory[existingIdx].daysLeft, Number(newItem.daysLeft))
          };
        } else {
          nextInventory = [
            {
              id: `item-${Date.now()}`,
              ...newItem,
              name: stdName,
              quantity: Number(newItem.quantity),
              daysLeft: Number(newItem.daysLeft)
            },
            ...inventory
          ];
        }
        setInventory(nextInventory);
        saveAndSync({
          inventory: nextInventory,
          logs: consumptionLogs,
          mealsByOffset,
          completedMealsByOffset
        });
        showToast(`'${stdName}' ${newItem.quantity}${newItem.unit} 추가 완료!`);
        setNewItem({ name: '', category: '채소/과일', quantity: 1, unit: '개', daysLeft: 5, storage: '냉장' });
        setIsAddModalOpen(false);
      };

      const handleUpdateInventoryItem = (e) => {
        e.preventDefault();
        if (!editingItem || !editingItem.name.trim()) return;
        const cleanName = editingItem.name.trim();
        const nextQty = Math.max(0, Number(editingItem.quantity) || 0);
        const nextDays = Math.max(0, Number(editingItem.daysLeft) || 0);

        const nextInventory = inventory
          .map((item) =>
            item.id === editingItem.id
              ? {
                  ...item,
                  name: cleanName,
                  category: editingItem.category,
                  quantity: nextQty,
                  unit: editingItem.unit,
                  daysLeft: nextDays,
                  storage: editingItem.storage || '냉장'
                }
              : item
          )
          .filter((item) => Number(item.quantity) > 0);

        setInventory(nextInventory);
        saveAndSync({
          inventory: nextInventory,
          logs: consumptionLogs,
          mealsByOffset,
          completedMealsByOffset
        });
        showToast(`'${cleanName}' 정보가 수정되었습니다.`);
        setEditingItem(null);
      };

      // --- 우리 아이 액자 (매일 2장 자동 디스플레이 + 얼굴 중심 자동 줌) ---
      const displayedKidsPhotos = useMemo(() => {
        if (!Array.isArray(kidsPhotos) || kidsPhotos.length === 0) return [];
        if (kidsPhotos.length === 1) return [kidsPhotos[0]];
        const baseIdx = (getDailySeedIndex() * 2 + photoRotationShift * 2) % kidsPhotos.length;
        const first = kidsPhotos[baseIdx];
        const second = kidsPhotos[(baseIdx + 1) % kidsPhotos.length];
        return [first, second];
      }, [kidsPhotos, photoRotationShift]);

      const handleUploadKidsPhotos = async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        const roomLeft = Math.max(0, 24 - kidsPhotos.length);
        if (roomLeft === 0) {
          showToast('최대 24장까지 저장 가능합니다. [앨범 관리]에서 오래된 사진을 정리해 주세요.');
          if (kidsPhotoInputRef.current) kidsPhotoInputRef.current.value = '';
          return;
        }
        const selectedFiles = files.slice(0, roomLeft);
        try {
          const compressedList = await Promise.all(selectedFiles.map((f) => compressKidPhotoFile(f)));
          const newEntries = compressedList.map(({ dataUrl, faceFocus }, idx) => ({
            id: `kidphoto-${Date.now()}-${idx}`,
            dataUrl,
            faceFocus,
            zoomEnabled: true,
            addedDate: getTodayDateString()
          }));
          const nextPhotos = [...newEntries, ...kidsPhotos];
          setKidsPhotos(nextPhotos);
          setPhotoRotationShift(0);
          await saveAndSync({
            inventory,
            logs: consumptionLogs,
            mealsByOffset,
            completedMealsByOffset,
            deductedHistoryByOffset,
            favoriteMeals,
            kidsPhotos: nextPhotos
          });
          showToast(`아이 사진 ${newEntries.length}장이 연동되었습니다.`);
        } catch {
          showToast('사진 처리 중 오류가 발생했습니다. 다시 시도해 주세요.');
        } finally {
          if (kidsPhotoInputRef.current) kidsPhotoInputRef.current.value = '';
        }
      };

      const handleTogglePhotoFaceZoom = async (photoId) => {
        const nextPhotos = kidsPhotos.map((p) =>
          p.id === photoId ? { ...p, zoomEnabled: p.zoomEnabled === false ? true : false } : p
        );
        setKidsPhotos(nextPhotos);
        await saveAndSync({
          inventory,
          logs: consumptionLogs,
          mealsByOffset,
          completedMealsByOffset,
          deductedHistoryByOffset,
          favoriteMeals,
          kidsPhotos: nextPhotos
        });
      };

      const handleRemoveKidsPhoto = async (photoId) => {
        const nextPhotos = kidsPhotos.filter((p) => p.id !== photoId);
        setKidsPhotos(nextPhotos);
        await saveAndSync({
          inventory,
          logs: consumptionLogs,
          mealsByOffset,
          completedMealsByOffset,
          deductedHistoryByOffset,
          favoriteMeals,
          kidsPhotos: nextPhotos
        });
        showToast('사진이 앨범에서 삭제되었습니다.');
      };

      // --- 영수증 이미지 업로드 & 파서 ---
      const handleReceiptImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          setReceiptImagePreview(dataUrl);
          setReceiptImageBase64({ mimeType: file.type || 'image/jpeg', data: dataUrl.split(',')[1] });
          setReceiptError('');
        };
        reader.readAsDataURL(file);
      };

      const handleClearReceiptImage = () => {
        setReceiptImagePreview(null);
        setReceiptImageBase64(null);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const smartParseKoreanReceiptText = (rawText) => {
        const headerFooterStopKeywords = [
          '합계', '총구매액', '과세물품', '면세물품', '부가세', '받을금액', '결제금액',
          '신용카드', '카드승인', '승인번호', '할부개월', '포인트', '적립', '교환', '환불',
          '영수증', '거래일시', '계산원', 'POS', '사업자', '대표자', '전화', 'TEL', '주소'
        ];
        const storeMetaKeywords = [
          '이마트', '롯데마트', '홈플러스', '트레이더스', '코스트코', '하나로마트', '노브랜드',
          '쿠팡', '로켓프레시', '마켓컬리', '컬리', '새벽배송', '주문일시', '주문내역',
          '배송비', '장바구니', '할인', '행사', '쿠폰', '증정', '에누리', '단가', '수량', '금액', '상품명'
        ];
        const nonFoodKeywords = [
          '물티슈', '휴지', '화장지', '키친타올', '세제', '섬유유연제', '기저귀', '비닐', '종량제',
          '수세미', '치약', '칫솔', '샴푸', '린스', '바디워시', '로션', '건전지', '호일', '랩', '장갑'
        ];

        const rawLines = rawText
          .split('\n')
          .map((l) => l.replace(/\s+/g, ' ').trim())
          .filter((l) => l.length > 1);

        const mergedEntries = [];
        for (let i = 0; i < rawLines.length; i++) {
          const line = rawLines[i];
          if (mergedEntries.length > 0 && /^(합\s*계|총\s*액|결제금액|과세물품|신용카드|카드승인)/.test(line)) break;
          if (
            /\d{3}-\d{2}-\d{5}/.test(line) ||
            /\d{2,3}-\d{3,4}-\d{4}/.test(line) ||
            /^\d{4}[./-]\d{2}[./-]\d{2}/.test(line) ||
            /^(서울|경기|인천|부산|대구|대전|광주|울산|세종|강원|충북|충남|전북|전남|경북|경남|제주).*(시|구|군|로|길)/.test(line)
          ) continue;
          if (/행사|할인|에누리|쿠폰/.test(line) && /-\s*[\d,]+/.test(line)) continue;
          if (/^-\s*[\d,]+원?$/.test(line)) continue;

          const barcodeLineMatch = line.match(/^(\d{8,14})\s+([\d,]+)\s+(\d+)\s+([\d,]+)$/);
          if (barcodeLineMatch) {
            if (mergedEntries.length > 0) mergedEntries[mergedEntries.length - 1].purchasedPacks = Number(barcodeLineMatch[3]) || 1;
            continue;
          }
          if (/^\d{8,14}$/.test(line)) continue;
          if (/^[\d,]+원?$/.test(line)) continue;
          if (headerFooterStopKeywords.some((kw) => line.includes(kw) && line.length < 30)) continue;
          if (storeMetaKeywords.some((kw) => line.startsWith(kw) || (line.includes(kw) && line.length < 24))) continue;
          if (nonFoodKeywords.some((kw) => line.includes(kw))) continue;

          let purchasedPacks = 1;
          let textPart = line;
          const sameLinePosMatch = line.match(/^(.+?)\s+[\d,]{3,}\s+(\d+)\s+[\d,]{3,}$/);
          if (sameLinePosMatch) {
            textPart = sameLinePosMatch[1];
            purchasedPacks = Number(sameLinePosMatch[2]) || 1;
          }
          mergedEntries.push({ raw: textPart, purchasedPacks });
        }

        const results = [];
        mergedEntries.forEach(({ raw, purchasedPacks }, idx) => {
          let quantity = purchasedPacks;
          let unit = '개';
          let bundleSize = 1;

          const packCountMatch = raw.match(/(\d+)\s*(?:개입|입|번들|팩입)/);
          const xCountMatch = raw.match(/[xX*×]\s*(\d+)\s*(개|팩|봉|모|구|단|송이|병|통|캔|입)?/);
          const parenCountMatch = raw.match(/\(약?\s*(\d+)\s*(장|구|개|입|봉|모)\)/);
          const inlineUnitMatch = raw.match(/(\d+)\s*(모|구|봉|팩|송이|단|장)\b/);
          const weightMatch = raw.match(/(\d+(?:\.\d+)?)\s*(g|kg|ml|L)\b/i);

          if (packCountMatch) {
            bundleSize = Number(packCountMatch[1]) || 1;
            quantity = purchasedPacks * bundleSize;
          } else if (parenCountMatch) {
            bundleSize = Number(parenCountMatch[1]) || 1;
            quantity = purchasedPacks * bundleSize;
            unit = parenCountMatch[2] === '입' ? '개' : parenCountMatch[2];
          } else if (xCountMatch) {
            quantity = purchasedPacks * (Number(xCountMatch[1]) || 1);
            if (xCountMatch[2] && xCountMatch[2] !== '입') unit = xCountMatch[2];
            else if (inlineUnitMatch) unit = inlineUnitMatch[2];
          } else if (inlineUnitMatch) {
            bundleSize = Number(inlineUnitMatch[1]) || 1;
            quantity = purchasedPacks * bundleSize;
            unit = inlineUnitMatch[2];
          } else if (weightMatch && !/(우유|두유|요거트|요구르트|음료|주스)/.test(raw)) {
            const val = Number(weightMatch[1]);
            const wUnit = weightMatch[2].toLowerCase();
            if (wUnit === 'kg') { quantity = purchasedPacks * val * 1000; unit = 'g'; }
            else if (wUnit === 'l') { quantity = purchasedPacks * val * 1000; unit = 'ml'; }
            else { quantity = purchasedPacks * val; unit = wUnit; }
          } else if (/(바나나우유|딸기우유|초코우유|커피우유|가공유)/.test(raw) && !/900ml|1L|1000ml/i.test(raw)) {
            bundleSize = 4;
            quantity = purchasedPacks * 4;
          } else if (/(요구르트|엔요|야쿠르트)/.test(raw)) {
            bundleSize = 5;
            quantity = purchasedPacks * 5;
          } else if (/(슬라이스\s*치즈|어린이\s*치즈|체다\s*치즈)/.test(raw)) {
            bundleSize = 10;
            quantity = purchasedPacks * 10;
            unit = '장';
          }

          let rawCleanName = raw
            .replace(/^\*?\d{1,3}[\.\)]?\s+/, '')
            .replace(/\s+[A-Z]\d$/i, '')
            .replace(/\[.*?\]/g, '')
            .replace(/\(.*?\)/g, '')
            .replace(/[xX*×]\s*\d+.*$/g, '')
            .replace(/\s+\d+(?:개입|입|번들)\b/g, '')
            .replace(/[\d,]{3,}원?.*$/g, '')
            .replace(/\s+\d+(?:\.\d+)?\s*(g|kg|ml|L)\b/gi, '')
            .replace(/\s+\d+\s*(모|구|봉|팩|송이|단|장)\b/g, '')
            .trim();

          if (!rawCleanName || rawCleanName.length < 2 || /^\d+$/.test(rawCleanName)) return;

          const stdName = toStandardIngredientName(rawCleanName);
          let category = '채소/과일';
          let estimatedExpiryDays = 5;
          let storage = '냉장';

          if (/(한우|소고기|돼지고기|삼겹살|목살|다짐육|안심|닭|오리|연어|고등어|갈치|새우|오징어|조개|전복|멸치|어묵|맛살|소시지|햄|떡갈비)/.test(stdName)) {
            category = '정육/수산';
            estimatedExpiryDays = /(어묵|햄|소시지|떡갈비)/.test(stdName) ? 7 : 2;
          } else if (/(우유|두유|두부|순두부|계란|유정란|달걀|치즈|요거트|요구르트|버터|생크림)/.test(stdName)) {
            category = '유제품/계란';
            estimatedExpiryDays = /두부/.test(stdName) ? 3 : /(계란|치즈)/.test(stdName) ? 12 : 7;
          } else if (/(냉동|만두|돈까스|피자|아이스크림|볶음밥|너겟|핫도그)/.test(rawCleanName)) {
            category = '냉동/가공';
            storage = '냉동';
            estimatedExpiryDays = 30;
          } else if (/(식빵|빵|모닝빵|떡|쌀|잡곡|면|파스타|우동|국수|라면|김|참기름|간장|된장|고추장|케첩|마요네즈|시리얼|과자|초콜릿|킨더|젤리|사탕)/.test(stdName)) {
            category = '곡류/기타';
            storage = '실온';
            estimatedExpiryDays = /(식빵|모닝빵)/.test(stdName) ? 4 : 30;
          } else {
            category = '채소/과일';
            if (/(바나나|고구마|감자|양파|마늘|단호박)/.test(stdName)) storage = '실온';
            estimatedExpiryDays = /(딸기|시금치|상추|깻잎|숙주|콩나물|버섯|바나나)/.test(stdName) ? 3 : 6;
          }

          results.push({
            tempId: `smart-${Date.now()}-${idx}`,
            name: stdName,
            originalName: rawCleanName !== stdName ? rawCleanName : '',
            category,
            quantity,
            unit,
            bundleApplied: bundleSize > 1 ? bundleSize : null,
            estimatedExpiryDays,
            storage
          });
        });

        return results;
      };

      const handleParseReceipt = async () => {
        if (!receiptText.trim() && !receiptImageBase64) {
          setReceiptError('영수증 사진을 올리거나 마트 앱 주문 내역 텍스트를 먼저 입력해 주세요.');
          return;
        }
        setIsParsingReceipt(true);
        setReceiptError('');
        setParsedItems([]);

        if (geminiApiKey && geminiApiKey.trim().startsWith('AIza')) {
          try {
            const parts = [
              {
                text: `한국 대형마트/온라인마트 영수증에서 실제 구매한 '식자재'만 추출하여 JSON 배열로 반환하세요. 매장명, 바코드, 가격, 할인 줄, 비식품은 제외하고, 품목명(name)은 브랜드·수식어를 제거한 표준 식재료명(예: 소고기 다짐육, 계란, 두부, 딸기, 식빵, 우유)으로 치환하세요. 번들 상품(4입, 바나나우유 등)은 실제 낱개 총수량으로 계산하세요. 각 항목은 name, originalName, category("채소/과일"|"정육/수산"|"유제품/계란"|"냉동/가공"|"곡류/기타"), quantity, unit, estimatedExpiryDays, storage("냉장"|"냉동"|"실온")를 포함합니다.`
              }
            ];
            if (receiptText.trim()) parts.push({ text: `\n[영수증 텍스트]\n${receiptText}` });
            if (receiptImageBase64) parts.push({ inlineData: receiptImageBase64 });

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts }],
                  generationConfig: { responseMimeType: 'application/json' }
                })
              }
            );
            if (!res.ok) throw new Error('Gemini API 호출 실패');
            const data = await res.json();
            const aiItems = JSON.parse(data?.candidates?.[0]?.content?.parts?.[0]?.text || '[]');
            if (Array.isArray(aiItems) && aiItems.length > 0) {
              setParsedItems(
                aiItems.map((it, idx) => {
                  const rawN = it.originalName || it.name || '식재료';
                  const stdN = toStandardIngredientName(it.name || rawN);
                  return {
                    tempId: `ai-${Date.now()}-${idx}`,
                    name: stdN,
                    originalName: rawN !== stdN ? rawN : '',
                    category: it.category || '채소/과일',
                    quantity: Number(it.quantity) || 1,
                    unit: it.unit || '개',
                    estimatedExpiryDays: Number(it.estimatedExpiryDays) || 5,
                    storage: it.storage || '냉장'
                  };
                })
              );
              setIsParsingReceipt(false);
              showToast(`Gemini AI가 ${aiItems.length}개 식자재를 표준 식재료명으로 추출했습니다.`);
              return;
            }
          } catch {
            if (receiptImageBase64 && !receiptText.trim()) {
              setIsParsingReceipt(false);
              setReceiptError('영수증 사진 인식에 실패했습니다. API 키를 확인하거나 주문내역 텍스트를 붙여넣어 주세요.');
              return;
            }
          }
        } else if (receiptImageBase64 && !receiptText.trim()) {
          setIsParsingReceipt(false);
          setReceiptError('영수증 사진 자동 인식을 쓰려면 좌측 하단 [설정]에서 무료 Gemini API 키를 등록해 주세요!');
          return;
        }

        setTimeout(() => {
          const extracted = smartParseKoreanReceiptText(receiptText);
          setParsedItems(extracted);
          setIsParsingReceipt(false);
          if (extracted.length === 0) {
            setReceiptError('인식된 식자재 품목이 없습니다. 상품명이 포함된 줄을 입력해 주세요.');
          } else {
            showToast(`영수증에서 ${extracted.length}개 식자재를 표준 식재료명으로 추출했습니다.`);
          }
        }, 350);
      };

      const handleUpdateParsedItem = (tempId, field, value) => {
        setParsedItems((prev) =>
          prev.map((item) => (item.tempId === tempId ? { ...item, [field]: value } : item))
        );
      };

      const handleRemoveParsedItem = (tempId) => {
        setParsedItems((prev) => prev.filter((item) => item.tempId !== tempId));
      };

      const handleConfirmAddParsedItems = () => {
        if (parsedItems.length === 0) return;
        const nextInv = [...inventory];
        parsedItems.forEach((pItem) => {
          const stdName = toStandardIngredientName(pItem.name);
          const existingIdx = nextInv.findIndex(
            (inv) => inv.name === stdName && inv.unit === pItem.unit
          );
          if (existingIdx > -1) {
            nextInv[existingIdx] = {
              ...nextInv[existingIdx],
              quantity: Number((nextInv[existingIdx].quantity + Number(pItem.quantity)).toFixed(2)),
              daysLeft: Math.min(nextInv[existingIdx].daysLeft, Number(pItem.estimatedExpiryDays))
            };
          } else {
            nextInv.unshift({
              id: `inv-${Date.now()}-${Math.random()}`,
              name: stdName,
              category: pItem.category,
              quantity: Number(pItem.quantity),
              unit: pItem.unit,
              daysLeft: Number(pItem.estimatedExpiryDays),
              storage: pItem.storage || '냉장'
            });
          }
        });
        setInventory(nextInv);
        saveAndSync({
          inventory: nextInv,
          logs: consumptionLogs,
          mealsByOffset,
          completedMealsByOffset
        });
        showToast(`${parsedItems.length}개 식자재가 냉장고 재고에 반영되었습니다.`);
        setParsedItems([]);
        setReceiptText('');
        handleClearReceiptImage();
        setActiveTab('overview');
      };

      // --- 3일치 맞춤 식단 생성 ---
      const handleGenerateMeals = async () => {
        setIsGeneratingMeals(true);

        const cfg = familyProfile.mealConfig || DEFAULT_MEAL_CONFIG;
        const allergyList = [
          ...(familyProfile.allergies || []),
          ...(familyProfile.customAllergyText ? [familyProfile.customAllergyText] : [])
        ];
        const kidsText = (familyProfile.kids || [])
          .map(
            (k) =>
              `- ${k.nickname || '아이'}: ${formatKidAgeLabel(k.birthYearMonth) || '유아'} (${k.mealStage}, ${
                k.attendsInstitution === false ? '가정 보육/평일 점심 집밥' : '기관 등원/평일 점심 급식'
              })`
          )
          .join('\n');

        const inventorySummary = inventory
          .map((i) => `- ${i.name}: ${i.quantity}${i.unit} (D-${i.daysLeft})`)
          .join('\n');

        if (geminiApiKey && geminiApiKey.trim().startsWith('AIza')) {
          try {
            const prompt = `당신은 가정식 및 아이 식단 전문가입니다.
아래 3일치 날짜에 대한 맞춤 식단표를 한 번에 JSON 객체 {"day0": [...], "day1": [...], "day2": [...]} 형태로 반환하세요:
- day0 (오늘): ${todayInfo.dateStr} (${todayInfo.dayName}요일, ${todayInfo.isWeekend ? '주말' : '평일'})
- day1 (내일): ${tomorrowInfo.dateStr} (${tomorrowInfo.dayName}요일, ${tomorrowInfo.isWeekend ? '주말' : '평일'})
- day2 (모레): ${dayAfterTomorrowInfo.dateStr} (${dayAfterTomorrowInfo.dayName}요일, ${dayAfterTomorrowInfo.isWeekend ? '주말' : '평일'})

[가족 구성원]
${kidsText || '- 일반 가정'}
* 제외할 알레르기: ${allergyList.length > 0 ? allergyList.join(', ') : '없음'}
* ${hasHomeCareKid ? '가정 보육 아이가 있어 평일에도 점심 식단 생성' : '평일 기관 등원으로 점심 식단 제외 (주말만 점심 생성)'}

[끼니별 스타일 및 선호 조건]
- 아침: [${cfg.아침?.style || '간단'}] / 조건: ${(cfg.아침?.conditions || []).join(', ') || '자유'}
- 점심: [${cfg.점심?.style || '간단'}] / 조건: ${(cfg.점심?.conditions || []).join(', ') || '자유'}
- 저녁: [${cfg.저녁?.style || '한식'}] / 조건: ${(cfg.저녁?.conditions || []).join(', ') || '자유'}

[한식 표기 규칙]
- 한식 정식은 title을 반드시 "잡곡밥 · OO국 & 3찬 (반찬1 · 반찬2 · 반찬3)" 형식으로 작성하세요.
- 3일 동안 점심/저녁 메뉴와 반찬이 겹치지 않게 다양하게 구성하세요.

[현재 냉장고 재고]
${inventorySummary}

각 날짜 배열의 원소는 type("아침"|"점심"|"저녁"), title, mealStyle, appliedConditions(배열), includedFruit(문자열), ingredientsUsed([{name, amount, unit}]), recipeQuery 를 포함해야 합니다.`;

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { responseMimeType: 'application/json' }
                })
              }
            );
            if (!res.ok) throw new Error('Meal API error');
            const data = await res.json();
            const parsedObj = JSON.parse(data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}');
            const d0 = parsedObj?.day0;
            const d1 = parsedObj?.day1;
            const d2 = parsedObj?.day2;
            if (Array.isArray(d0) && d0.length > 0 && Array.isArray(d1) && d1.length > 0 && Array.isArray(d2) && d2.length > 0) {
              const nextMealsByOffset = { 0: d0, 1: d1, 2: d2 };
              const nextCompletedByOffset = { 0: {}, 1: {}, 2: {} };
              setMealsByOffset(nextMealsByOffset);
              setCompletedMealsByOffset(nextCompletedByOffset);
              setIsGeneratingMeals(false);
              saveAndSync({
                inventory,
                logs: consumptionLogs,
                mealsByOffset: nextMealsByOffset,
                completedMealsByOffset: nextCompletedByOffset
              });
              showToast('오늘 · 내일 · 모레 3일치 맞춤 AI 식단이 생성되었습니다.');
              return;
            }
          } catch {}
        }

        // 내장 스마트 조합 엔진 (3일치 동시 편성)
        setTimeout(() => {
          const isAllergic = (name) => allergyList.some((al) => name.includes(al));
          const safeInv = inventory.filter((i) => !isAllergic(i.name));

          const fruits = safeInv.filter((i) => /(사과|바나나|딸기|포도|귤|배|수박|참외|블루베리)/.test(i.name));
          const dairies = safeInv.filter((i) => /(우유|요거트|요구르트|치즈)/.test(i.name));
          const proteins = safeInv.filter((i) => i.category === '정육/수산' || /(두부|계란|유정란)/.test(i.name));
          const vegs = safeInv.filter((i) => i.category === '채소/과일' && !fruits.some((f) => f.id === i.id));

          const bCfg = cfg.아침 || DEFAULT_MEAL_CONFIG.아침;
          const lCfg = cfg.점심 || DEFAULT_MEAL_CONFIG.점심;
          const dCfg = cfg.저녁 || DEFAULT_MEAL_CONFIG.저녁;

          const buildDayMeals = (offsetIdx) => {
            const chosenFruit = fruits[offsetIdx % Math.max(1, fruits.length)] || { name: '제철 과일', unit: '개' };
            const chosenDairy = dairies[offsetIdx % Math.max(1, dairies.length)] || { name: '우유', unit: 'ml' };
            const lunchProtein = proteins[offsetIdx % Math.max(1, proteins.length)] || { name: '계란', unit: '구' };
            const dinnerProtein =
              proteins.find((p) => p.name !== lunchProtein.name) ||
              proteins[(offsetIdx + 1) % Math.max(1, proteins.length)] ||
              { name: '두부', unit: '모' };

            const veg1 = vegs[offsetIdx % Math.max(1, vegs.length)] || { name: '애호박', unit: '개' };
            const veg2 = vegs.find((v) => v.name !== veg1.name) || vegs[(offsetIdx + 1) % Math.max(1, vegs.length)] || { name: '당근', unit: '개' };

            const fShort = toStandardIngredientName(chosenFruit.name);
            const dShort = toStandardIngredientName(chosenDairy.name);
            const lpShort = toStandardIngredientName(lunchProtein.name);
            const dpShort = toStandardIngredientName(dinnerProtein.name);
            const v1Short = toStandardIngredientName(veg1.name);
            const v2Short = toStandardIngredientName(veg2.name);

            const hasFruitB = (bCfg.conditions || []).includes('과일 필수');
            const hasDairyB = (bCfg.conditions || []).includes('유제품 필수');
            const bExtras = [hasFruitB ? fShort : '', hasDairyB ? dShort : ''].filter(Boolean);
            const bBase =
              bCfg.style === '초간단'
                ? '구운 식빵 & 시리얼'
                : bCfg.style === '한식'
                ? `잡곡밥 & ${v1Short} 계란국`
                : offsetIdx % 2 === 0
                ? '스크램블 에그 & 구운 식빵'
                : '프렌치토스트';
            const breakfastTitle = [bBase, ...bExtras].join(' & ');

            const lunchTitle =
              lCfg.style === '초간단'
                ? `${v1Short} 주먹밥 & 맑은 계란국`
                : lCfg.style === '한식'
                ? `잡곡밥 · 된장국 & 3찬 (${lpShort} 구이 · ${v1Short}볶음 · 계란말이)`
                : `${lpShort} ${v1Short} 볶음밥 & 맑은 두부국`;

            const dinnerTitle =
              dCfg.style === '초간단'
                ? `${dpShort} 덮밥 & 데친 ${v2Short}`
                : dCfg.style === '간단'
                ? `${dpShort} ${v2Short} 야채볶음 & 계란국`
                : `잡곡밥 · ${v2Short} 맑은국 & 3찬 (${dpShort} 구이 · ${v2Short}볶음 · 두부부침)`;

            return [
              {
                type: '아침',
                title: breakfastTitle,
                mealStyle: bCfg.style,
                appliedConditions: bCfg.conditions || [],
                includedFruit: hasFruitB ? fShort : '',
                ingredientsUsed: [
                  ...(hasFruitB ? [{ name: chosenFruit.name, amount: 1, unit: chosenFruit.unit }] : []),
                  ...(hasDairyB ? [{ name: chosenDairy.name, amount: chosenDairy.unit === 'ml' ? 200 : 1, unit: chosenDairy.unit }] : []),
                  { name: veg1.name, amount: 0.5, unit: veg1.unit }
                ],
                recipeQuery: `${bBase} 레시피`
              },
              {
                type: '점심',
                title: lunchTitle,
                mealStyle: lCfg.style,
                appliedConditions: lCfg.conditions || [],
                includedFruit: '',
                ingredientsUsed: [
                  { name: lunchProtein.name, amount: lunchProtein.unit === 'g' ? 120 : 1, unit: lunchProtein.unit },
                  { name: veg1.name, amount: 0.5, unit: veg1.unit }
                ],
                recipeQuery: `${lpShort} ${v1Short} 요리 레시피`
              },
              {
                type: '저녁',
                title: dinnerTitle,
                mealStyle: dCfg.style,
                appliedConditions: dCfg.conditions || [],
                includedFruit: '',
                ingredientsUsed: [
                  { name: dinnerProtein.name, amount: dinnerProtein.unit === 'g' ? 150 : 1, unit: dinnerProtein.unit },
                  { name: veg2.name, amount: 1, unit: veg2.unit }
                ],
                recipeQuery: `${dpShort} ${v2Short} 저녁 반찬 레시피`
              }
            ];
          };

          const nextMealsByOffset = {
            0: buildDayMeals(0),
            1: buildDayMeals(1),
            2: buildDayMeals(2)
          };
          const nextCompletedByOffset = { 0: {}, 1: {}, 2: {} };
          setMealsByOffset(nextMealsByOffset);
          setCompletedMealsByOffset(nextCompletedByOffset);
          setIsGeneratingMeals(false);
          saveAndSync({
            inventory,
            logs: consumptionLogs,
            mealsByOffset: nextMealsByOffset,
            completedMealsByOffset: nextCompletedByOffset
          });
          showToast('오늘 · 내일 · 모레 3일치 맞춤 식단이 새롭게 구성되었습니다.');
        }, 400);
      };

      // --- 요리 완료 실제 수량 확인 모달 및 되돌리기 ---
      const handleOpenCompleteMealModal = (meal, targetOffset = selectedDayOffset) => {
        const dayCompleted = completedMealsByOffset[targetOffset] || {};
        if (dayCompleted[meal.type]) return;
        const editableIngredients = (meal.ingredientsUsed || []).map((used, idx) => {
          const matchedInv = inventory.find(
            (inv) => inv.name.includes(used.name) || used.name.includes(inv.name)
          );
          const currentStock = matchedInv ? Number(matchedInv.quantity) : 0;
          const unit = matchedInv ? matchedInv.unit : used.unit;
          const defaultAmount = matchedInv
            ? matchedInv.unit === used.unit
              ? Math.min(currentStock, Number(used.amount))
              : Math.min(currentStock, 1)
            : Number(used.amount);

          return {
            key: `${used.name}-${idx}`,
            invId: matchedInv ? matchedInv.id : null,
            name: matchedInv ? matchedInv.name : used.name,
            amount: Number(defaultAmount.toFixed(2)),
            unit,
            currentStock,
            category: matchedInv ? matchedInv.category : '채소/과일',
            storage: matchedInv ? matchedInv.storage : '냉장',
            daysLeft: matchedInv ? matchedInv.daysLeft : 3
          };
        });

        setCookingConfirmModal({
          meal,
          dayOffset: targetOffset,
          items: editableIngredients
        });
      };

      const handleConfirmCompleteMeal = () => {
        if (!cookingConfirmModal) return;
        const { meal, dayOffset, items } = cookingConfirmModal;
        const targetDateLabel = (dateInfos[dayOffset] || todayInfo).label;

        let deductedCount = 0;
        let workingInventory = [...inventory];
        let workingLogs = [...consumptionLogs];
        const deductedRecords = [];

        items.forEach((entry) => {
          const amt = Number(entry.amount) || 0;
          if (amt <= 0) return;

          const targetIdx = workingInventory.findIndex(
            (inv) => inv.id === entry.invId || inv.name.includes(entry.name) || entry.name.includes(inv.name)
          );
          if (targetIdx > -1) {
            const target = workingInventory[targetIdx];
            const actualUsed = Math.min(Number(target.quantity), amt);
            const nextQty = Number((Number(target.quantity) - actualUsed).toFixed(2));

            if (actualUsed > 0) {
              const now = new Date();
              const timeStr = `오늘 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
              workingLogs.unshift({
                id: `log-${Date.now()}-${Math.random()}`,
                name: target.name,
                amount: actualUsed,
                unit: target.unit,
                time: timeStr,
                note: `${targetDateLabel} ${meal.type} 조리`
              });
              deductedRecords.push({
                name: target.name,
                amount: actualUsed,
                unit: target.unit,
                category: target.category,
                storage: target.storage,
                daysLeft: target.daysLeft
              });
              deductedCount++;
            }
            workingInventory[targetIdx] = { ...target, quantity: nextQty };
          }
        });

        workingInventory = workingInventory.filter((item) => Number(item.quantity) > 0);
        const nextCompletedByOffset = {
          ...completedMealsByOffset,
          [dayOffset]: { ...(completedMealsByOffset[dayOffset] || {}), [meal.type]: true }
        };
        const nextHistoryByOffset = {
          ...deductedHistoryByOffset,
          [dayOffset]: { ...(deductedHistoryByOffset[dayOffset] || {}), [meal.type]: deductedRecords }
        };

        setInventory(workingInventory);
        setConsumptionLogs(workingLogs);
        setCompletedMealsByOffset(nextCompletedByOffset);
        setDeductedHistoryByOffset(nextHistoryByOffset);
        setCookingConfirmModal(null);

        saveAndSync({
          inventory: workingInventory,
          logs: workingLogs,
          mealsByOffset,
          completedMealsByOffset: nextCompletedByOffset,
          deductedHistoryByOffset: nextHistoryByOffset
        });

        showToast(
          deductedCount > 0
            ? `${targetDateLabel} '${meal.type}' 요리 완료! 확인하신 수량대로 ${deductedCount}종이 차감되었습니다.`
            : `${targetDateLabel} '${meal.type}' 식단 완료 기록되었습니다.`
        );
      };

      const handleUndoCompleteMeal = (meal, targetOffset = selectedDayOffset) => {
        const dayHistory = deductedHistoryByOffset[targetOffset] || {};
        const records = dayHistory[meal.type] || [];

        let restoredInventory = [...inventory];
        let restoredCount = 0;

        records.forEach((rec) => {
          const existingIdx = restoredInventory.findIndex(
            (inv) => inv.name === rec.name && inv.unit === rec.unit
          );
          if (existingIdx > -1) {
            restoredInventory[existingIdx] = {
              ...restoredInventory[existingIdx],
              quantity: Number((Number(restoredInventory[existingIdx].quantity) + Number(rec.amount)).toFixed(2))
            };
          } else {
            restoredInventory.unshift({
              id: `restored-${Date.now()}-${Math.random()}`,
              name: rec.name,
              category: rec.category || '채소/과일',
              quantity: Number(rec.amount),
              unit: rec.unit,
              daysLeft: Number(rec.daysLeft) > 0 ? Number(rec.daysLeft) : 2,
              storage: rec.storage || '냉장'
            });
          }
          restoredCount++;
        });

        const nextCompletedDay = { ...(completedMealsByOffset[targetOffset] || {}) };
        delete nextCompletedDay[meal.type];
        const nextCompletedByOffset = {
          ...completedMealsByOffset,
          [targetOffset]: nextCompletedDay
        };

        const nextHistoryDay = { ...dayHistory };
        delete nextHistoryDay[meal.type];
        const nextHistoryByOffset = {
          ...deductedHistoryByOffset,
          [targetOffset]: nextHistoryDay
        };

        setInventory(restoredInventory);
        setCompletedMealsByOffset(nextCompletedByOffset);
        setDeductedHistoryByOffset(nextHistoryByOffset);

        saveAndSync({
          inventory: restoredInventory,
          logs: consumptionLogs,
          mealsByOffset,
          completedMealsByOffset: nextCompletedByOffset,
          deductedHistoryByOffset: nextHistoryByOffset
        });

        const targetLabel = (dateInfos[targetOffset] || todayInfo).label;
        showToast(
          restoredCount > 0
            ? `${targetLabel} '${meal.type}' 요리 완료 취소! 차감 재고 ${restoredCount}종이 복원되었습니다.`
            : `${targetLabel} '${meal.type}' 요리 완료 상태가 취소되었습니다.`
        );
      };

      // --- 반찬 1개 교체 & 내일도 이어 먹기 ---
      const handleRerollSingleBanchan = (mealType) => {
        const currentDayMeals = mealsByOffset[selectedDayOffset] || [];
        const targetMeal = currentDayMeals.find((m) => m.type === mealType);
        if (!targetMeal) return;

        const match = targetMeal.title.match(/^(.+?)\s*&\s*3찬\s*\((.+?)\)$/);
        if (!match) {
          showToast('밥·국·3찬 구성 식단에서만 반찬 개별 교체가 가능합니다.');
          return;
        }

        const basePrefix = match[1].trim();
        const banchans = match[2].split('·').map((s) => s.trim()).filter(Boolean);
        if (banchans.length < 3) return;

        const altBanchans = ['계란찜', '두부부침', '애호박볶음', '감자채볶음', '시금치나물', '김구이', '멸치볶음', '소고기 야채볶음'];
        const candidate = altBanchans.find((d) => !banchans.includes(d)) || '계란말이';
        const replaceIdx = Date.now() % 3;

        const nextBanchans = [...banchans];
        nextBanchans[replaceIdx] = candidate;
        const nextTitle = `${basePrefix} & 3찬 (${nextBanchans.join(' · ')})`;

        const updatedDayMeals = currentDayMeals.map((m) =>
          m.type === mealType
            ? {
                ...m,
                title: nextTitle,
                recipeQuery: `${nextBanchans[0]} ${nextBanchans[1]} 반찬 레시피`
              }
            : m
        );

        const nextMealsByOffset = { ...mealsByOffset, [selectedDayOffset]: updatedDayMeals };
        setMealsByOffset(nextMealsByOffset);
        saveAndSync({
          inventory,
          logs: consumptionLogs,
          mealsByOffset: nextMealsByOffset,
          completedMealsByOffset
        });
        showToast(`반찬 1가지를 '${candidate}'(으)로 교체했습니다.`);
      };

      const handleCarryOver3ChanToTomorrow = (meal) => {
        const match = meal.title.match(/&\s*3찬\s*\((.+?)\)$/);
        if (!match) return;
        const nextOffset = selectedDayOffset + 1;
        if (nextOffset > 2) return;
        const nextDayLabel = (dateInfos[nextOffset] || tomorrowInfo).label;
        const banchanSuffix = match[1].trim();
        const nextDayMeals = mealsByOffset[nextOffset] || [];
        const updatedNextDay = nextDayMeals.map((m) => {
          if (m.type !== '저녁') return m;
          const soupPart = m.title.split('&')[0].trim() || '잡곡밥 · 맑은국';
          return {
            ...m,
            title: `${soupPart} & 3찬 (${banchanSuffix})`
          };
        });

        const nextMealsByOffset = { ...mealsByOffset, [nextOffset]: updatedNextDay };
        setMealsByOffset(nextMealsByOffset);
        saveAndSync({
          inventory,
          logs: consumptionLogs,
          mealsByOffset: nextMealsByOffset,
          completedMealsByOffset
        });
        showToast(`${activeDateInfo.label}의 3찬(${banchanSuffix})이 ${nextDayLabel} 저녁 식단에도 반영되었습니다.`);
      };

      // --- 개별 요리별 별표(☆/★) 최애메뉴 저장 및 오늘/내일/모레 반영 ---
      const isDishFavorited = useCallback(
        (dishName) => favoriteMeals.some((f) => (f.dishName || f.title) === dishName),
        [favoriteMeals]
      );

      const handleToggleFavoriteDish = (dishName, parentMeal) => {
        if (!dishName || !isStarEligibleDish(dishName)) return;
        const exists = favoriteMeals.some((f) => (f.dishName || f.title) === dishName);
        let nextFavorites;
        if (exists) {
          nextFavorites = favoriteMeals.filter((f) => (f.dishName || f.title) !== dishName);
          showToast(`'${dishName}' 최애메뉴에서 해제되었습니다.`);
        } else {
          const kind = classifyDishKind(dishName);
          const favEntry = {
            id: `fav-${Date.now()}-${Math.random()}`,
            dishName,
            title: dishName,
            dishKind: kind,
            ingredientsUsed: Array.isArray(parentMeal?.ingredientsUsed) ? parentMeal.ingredientsUsed : [],
            recipeQuery: `${dishName} 집밥 레시피`,
            savedAt: Date.now()
          };
          nextFavorites = [favEntry, ...favoriteMeals];
          showToast(`'${dishName}' 최애메뉴에 저장되었습니다.`);
        }
        setFavoriteMeals(nextFavorites);
        saveAndSync({
          inventory,
          logs: consumptionLogs,
          mealsByOffset,
          completedMealsByOffset,
          favoriteMeals: nextFavorites
        });
      };

      const handleApplyFavoriteDishToDay = (favItem, targetOffset) => {
        const dishName = favItem.dishName || favItem.title;
        if (!dishName) return;
        const targetInfo = dateInfos[targetOffset] || todayInfo;
        const currentDayMeals = mealsByOffset[targetOffset] || [];
        const kind = favItem.dishKind || classifyDishKind(dishName);

        let updatedDayMeals = [...currentDayMeals];
        let appliedLabel = '저녁';

        if (kind === '한그릇 음식' && /(프렌치토스트)/.test(dishName)) {
          appliedLabel = '아침';
          updatedDayMeals = updatedDayMeals.map((m) =>
            m.type === '아침'
              ? { ...m, title: `${dishName} & 우유`, recipeQuery: `${dishName} 레시피` }
              : m
          );
        } else {
          appliedLabel = '저녁';
          updatedDayMeals = updatedDayMeals.map((m) => {
            if (m.type !== '저녁') return m;
            const match3Chan = m.title.match(/^(.+?)\s*&\s*3찬\s*\((.+?)\)$/);
            if (match3Chan) {
              const leftParts = match3Chan[1].split('·').map((s) => s.trim()).filter(Boolean);
              const sides = match3Chan[2].split('·').map((s) => s.trim()).filter(Boolean);
              if (kind === '국/찌개') {
                const nextLeft = leftParts.length >= 2 ? [leftParts[0], dishName] : ['잡곡밥', dishName];
                return {
                  ...m,
                  title: `${nextLeft.join(' · ')} & 3찬 (${sides.join(' · ')})`,
                  recipeQuery: `${dishName} ${sides[0] || ''} 레시피`
                };
              } else {
                const nextSides = sides.includes(dishName)
                  ? sides
                  : [dishName, ...sides.slice(0, 2)];
                return {
                  ...m,
                  title: `${leftParts.join(' · ')} & 3찬 (${nextSides.join(' · ')})`,
                  recipeQuery: `${nextSides[0]} ${nextSides[1] || ''} 반찬 레시피`
                };
              }
            }
            return {
              ...m,
              title: `잡곡밥 · ${kind === '국/찌개' ? dishName : '계란 맑은국'} & 3찬 (${kind === '국/찌개' ? '두부부침' : dishName} · 애호박볶음 · 계란찜)`,
              recipeQuery: `${dishName} 레시피`
            };
          });
        }

        const nextMealsByOffset = { ...mealsByOffset, [targetOffset]: updatedDayMeals };
        const nextCompletedByOffset = {
          ...completedMealsByOffset,
          [targetOffset]: { ...(completedMealsByOffset[targetOffset] || {}), [appliedLabel]: false }
        };

        setMealsByOffset(nextMealsByOffset);
        setCompletedMealsByOffset(nextCompletedByOffset);
        setSelectedDayOffset(targetOffset);
        setActiveTab('meals');

        saveAndSync({
          inventory,
          logs: consumptionLogs,
          mealsByOffset: nextMealsByOffset,
          completedMealsByOffset: nextCompletedByOffset,
          favoriteMeals
        });
        showToast(`'${dishName}' 메뉴를 ${targetInfo.label} ${appliedLabel} 식단에 반영했습니다.`);
      };

      const getCategoryStyle = (category) => {
        switch (category) {
          case '채소/과일':
            return { bg: 'bg-emerald-50 text-emerald-700 border-emerald-200/70' };
          case '정육/수산':
            return { bg: 'bg-rose-50 text-rose-700 border-rose-200/70' };
          case '유제품/계란':
            return { bg: 'bg-amber-50 text-amber-800 border-amber-200/70' };
          case '냉동/가공':
            return { bg: 'bg-sky-50 text-sky-700 border-sky-200/70' };
          default:
            return { bg: 'bg-purple-50 text-purple-700 border-purple-200/70' };
        }
      };

      const activeAllergies = [
        ...(familyProfile.allergies || []),
        ...(familyProfile.customAllergyText ? [familyProfile.customAllergyText] : [])
      ];

      return (
        <div className="min-h-screen bg-[#F6F5F0] text-slate-800 relative overflow-x-hidden">
          <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
            <div className="absolute -top-28 -left-24 w-96 h-96 rounded-full bg-emerald-200/35 blur-3xl" />
            <div className="absolute top-1/3 -right-24 w-[28rem] h-[28rem] rounded-full bg-orange-200/30 blur-3xl" />
            <div className="absolute -bottom-32 left-1/3 w-96 h-96 rounded-full bg-sky-200/30 blur-3xl" />
          </div>

          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-slate-900/95 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-white/10">
              <span className="text-emerald-400">✓</span>
              <span className="text-sm font-semibold">{toastMessage}</span>
            </div>
          )}

          <div className="relative z-10 flex flex-col md:flex-row min-h-screen w-full max-w-[1440px] mx-auto">
            {/* 좌측 슬림 사이드 레일 */}
            <aside className="w-full md:w-20 lg:w-24 shrink-0 bg-white/90 backdrop-blur-xl border-b md:border-b-0 md:border-r border-stone-200/80 px-3 py-3 md:py-6 flex md:flex-col items-center justify-between gap-3 md:sticky md:top-0 md:h-screen z-20">
              <div className="flex items-center gap-2.5 md:flex-col">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-600 flex items-center justify-center text-white shadow-lg shadow-emerald-500/25">
                  <Icon name="fridge" className="w-6 h-6" />
                </div>
                <span className="md:hidden text-sm font-extrabold text-slate-900 truncate max-w-[140px]">
                  {familyProfile.householdName || '스마트 냉장고'}
                </span>
              </div>

              <nav className="flex md:flex-col items-center gap-2">
                {[
                  { id: 'overview', label: '홈', icon: 'home', activeClass: 'bg-slate-900 text-white shadow-md' },
                  { id: 'meals', label: '식단', icon: 'utensils', activeClass: 'bg-gradient-to-br from-orange-500 to-amber-500 text-white shadow-md' },
                  { id: 'inventory', label: '현황', icon: 'fridge', activeClass: 'bg-gradient-to-br from-emerald-600 to-teal-600 text-white shadow-md' },
                  { id: 'receipt', label: '등록', icon: 'receipt', activeClass: 'bg-gradient-to-br from-indigo-600 to-violet-600 text-white shadow-md' }
                ].map((nav) => {
                  const isActive = activeTab === nav.id;
                  return (
                    <button
                      key={nav.id}
                      onClick={() => setActiveTab(nav.id)}
                      className={`w-14 h-14 md:w-16 md:h-16 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all active:scale-95 ${
                        isActive
                          ? nav.activeClass
                          : 'bg-stone-100/80 text-slate-500 hover:bg-stone-200/70 hover:text-slate-800'
                      }`}
                    >
                      <Icon name={nav.icon} className="w-5 h-5" />
                      <span className="text-[11px] font-extrabold tracking-tight">{nav.label}</span>
                    </button>
                  );
                })}
              </nav>

              <button
                onClick={() => setIsSettingsModalOpen(true)}
                title="가족 맞춤 · 공유 설정"
                className="relative w-11 h-11 md:w-14 md:h-14 rounded-2xl bg-stone-100/90 hover:bg-stone-200/80 text-slate-600 flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95"
              >
                <Icon name="settings" className="w-5 h-5" />
                <span className="hidden md:block text-[10px] font-bold">설정</span>
                <span className={`absolute top-2 right-2 w-2 h-2 rounded-full ring-2 ring-white ${cloudUrl ? 'bg-emerald-500' : 'bg-sky-500'}`} />
              </button>
            </aside>

            {/* 우측 메인 콘텐츠 */}
            <main className="flex-1 min-w-0 w-full p-4 md:p-6 lg:p-7 overflow-y-auto flex flex-col justify-between">
              <div>
                {/* 상단 헤더 바 (모바일 겹침 방지 2줄 구조) */}
                <div className="bg-white/85 backdrop-blur-md rounded-3xl p-3.5 md:px-5 border border-white shadow-sm mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-2.5">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-xs font-extrabold px-3 py-1.5 rounded-full bg-gradient-to-r from-amber-100 to-orange-100 text-amber-900 whitespace-nowrap">
                      {familyProfile.householdName || '우리집 스마트 냉장고'}
                    </span>
                    <span className="hidden sm:inline-flex text-xs font-bold px-2.5 py-1.5 rounded-full bg-stone-100 text-slate-700 whitespace-nowrap">
                      아:{familyProfile.mealConfig?.아침?.style || '간단'} · 점:{familyProfile.mealConfig?.점심?.style || '간단'} · 저:{familyProfile.mealConfig?.저녁?.style || '한식'}
                    </span>
                    {activeAllergies.length > 0 && (
                      <span className="text-xs font-extrabold px-2.5 py-1.5 rounded-full bg-purple-100 text-purple-800 whitespace-nowrap">
                        알레르기 제외: {activeAllergies.join(', ')}
                      </span>
                    )}
                    {expiringItems.length > 0 && (
                      <span className="text-xs font-extrabold px-2.5 py-1.5 rounded-full bg-rose-100 text-rose-700 whitespace-nowrap">
                        임박 {expiringItems.length}종
                      </span>
                    )}
                    <div className="inline-flex items-center gap-1">
                      <button
                        onClick={() => setIsSettingsModalOpen(true)}
                        className={`text-[11px] font-bold px-2.5 py-1.5 rounded-full border flex items-center gap-1.5 whitespace-nowrap transition-colors ${
                          syncStatus === 'local'
                            ? 'bg-sky-50 text-sky-800 border-sky-200/80 hover:bg-sky-100'
                            : syncStatus === 'offline'
                            ? 'bg-amber-50 text-amber-800 border-amber-200'
                            : 'bg-emerald-50 text-emerald-700 border-emerald-200/70 hover:bg-emerald-100'
                        }`}
                      >
                        <span
                          className={`w-2 h-2 rounded-full ${
                            syncStatus === 'local'
                              ? 'bg-sky-500'
                              : syncStatus === 'syncing'
                              ? 'bg-amber-400 animate-ping'
                              : syncStatus === 'offline'
                              ? 'bg-amber-500'
                              : 'bg-emerald-500'
                          }`}
                        />
                        <span>
                          {syncStatus === 'local'
                            ? '내 기기 저장'
                            : syncStatus === 'syncing'
                            ? '동기화 중...'
                            : syncStatus === 'offline'
                            ? '오프라인 백업'
                            : `공유 동기화됨 (${lastSyncedLabel})`}
                        </span>
                      </button>
                      {cloudUrl && (
                        <button
                          onClick={() => pullFromCloud(true)}
                          title="지금 즉시 가족 데이터 새로고침"
                          className="p-1.5 rounded-full bg-white hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 border border-stone-200/80 shadow-sm transition-all active:scale-90"
                        >
                          <Icon name="refresh" className={`w-3.5 h-3.5 ${syncStatus === 'syncing' ? 'animate-spin' : ''}`} />
                        </button>
                      )}
                    </div>
                  </div>

                  {/* 최애메뉴 + 3일 날짜 선택 + 3일 AI 식단 추천 */}
                  <div className="flex items-center gap-2 flex-wrap justify-between md:justify-end shrink-0 pt-2 md:pt-0 border-t md:border-t-0 border-stone-100">
                    <div className="flex items-center gap-1.5 flex-wrap">
                      {activeTab === 'meals' && (
                        <div className="inline-flex items-center bg-stone-100/90 p-1 rounded-2xl border border-stone-200/70">
                          {dateInfos.map((dInfo, idx) => (
                            <button
                              key={idx}
                              onClick={() => setSelectedDayOffset(idx)}
                              className={`px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                                selectedDayOffset === idx ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'
                              }`}
                            >
                              {dInfo.label} {dInfo.dateStr}({dInfo.dayName})
                            </button>
                          ))}
                        </div>
                      )}

                      <button
                        onClick={() => setActiveTab('favorites')}
                        className={`px-3 py-1.5 rounded-2xl text-xs font-extrabold whitespace-nowrap border transition-all flex items-center gap-1 ${
                          activeTab === 'favorites'
                            ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                            : 'bg-amber-50/80 text-amber-900 border-amber-200/80 hover:bg-amber-100'
                        }`}
                      >
                        <span className="text-amber-500">★</span>
                        <span>최애메뉴</span>
                        {favoriteMeals.length > 0 && (
                          <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-white/90 text-amber-900 font-black">
                            {favoriteMeals.length}
                          </span>
                        )}
                      </button>
                    </div>

                    <button
                      onClick={handleGenerateMeals}
                      disabled={isGeneratingMeals}
                      className="px-3.5 py-2 rounded-2xl bg-gradient-to-r from-orange-500 to-rose-500 hover:from-orange-600 hover:to-rose-600 text-white font-bold text-xs shadow-md flex items-center gap-1.5 whitespace-nowrap transition-all active:scale-95 ml-auto md:ml-0"
                    >
                      <Icon name="sparkles" className="w-3.5 h-3.5" />
                      <span>{isGeneratingMeals ? '3일치 생성 중...' : '3일 AI 식단 추천'}</span>
                    </button>
                  </div>
                </div>

                {/* VIEW 0: 홈 보드 */}
                {activeTab === 'overview' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div className="lg:col-span-8 space-y-4">
                      {/* 오늘의 우리 아이 액자 (선택적으로 숨기기 가능) */}
                      {familyProfile.showKidsPhotoFrame !== false && (
                        <div className="bg-white/95 rounded-3xl p-4 border border-white shadow-sm">
                          <input
                            ref={kidsPhotoInputRef}
                            type="file"
                            accept="image/*"
                            multiple
                            onChange={handleUploadKidsPhotos}
                            className="hidden"
                          />
                          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <div className="flex items-center gap-2">
                              <span className="text-sm font-extrabold text-slate-900">오늘의 우리 아이 액자</span>
                              <span className="text-[11px] font-semibold text-slate-400">
                                {kidsPhotos.length > 0 ? `매일 2장 자동 변경 · 총 ${kidsPhotos.length}장` : '사진을 올려두면 매일 2장씩 바뀌어요'}
                              </span>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                              {kidsPhotos.length > 2 && (
                                <button
                                  type="button"
                                  onClick={() => setPhotoRotationShift((s) => s + 1)}
                                  className="px-2.5 py-1 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 text-[11px] font-extrabold transition-colors"
                                >
                                  다른 2장
                                </button>
                              )}
                              {kidsPhotos.length > 0 && (
                                <button
                                  type="button"
                                  onClick={() => setIsPhotoManagerOpen(true)}
                                  className="px-2.5 py-1 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 text-[11px] font-bold transition-colors"
                                >
                                  앨범 관리
                                </button>
                              )}
                              <button
                                type="button"
                                onClick={() => kidsPhotoInputRef.current?.click()}
                                className="px-3 py-1 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-extrabold flex items-center gap-1 transition-colors"
                              >
                                <Icon name="camera" className="w-3 h-3" />
                                <span>+ 사진 추가</span>
                              </button>
                              <button
                                type="button"
                                onClick={() => {
                                  const nextProfile = { ...familyProfile, showKidsPhotoFrame: false };
                                  setFamilyProfile(nextProfile);
                                  saveAndSync({
                                    familyProfile: nextProfile,
                                    inventory,
                                    logs: consumptionLogs,
                                    mealsByOffset,
                                    completedMealsByOffset
                                  });
                                  showToast('액자를 숨겼습니다. [설정]에서 언제든 다시 켤 수 있습니다.');
                                }}
                                title="홈 화면에서 액자 숨기기"
                                className="px-2 py-1 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-500 text-[11px] font-bold transition-colors"
                              >
                                숨기기
                              </button>
                            </div>
                          </div>

                          {displayedKidsPhotos.length === 0 ? (
                            <button
                              type="button"
                              onClick={() => kidsPhotoInputRef.current?.click()}
                              className="w-[80%] mx-auto h-[190px] sm:h-[206px] rounded-2xl border-2 border-dashed border-emerald-200 bg-emerald-50/40 hover:bg-emerald-50 flex items-center justify-center gap-2 text-xs font-extrabold text-emerald-700 transition-colors"
                            >
                              <Icon name="camera" className="w-4 h-4" />
                              <span>사진첩에서 아이들 사진 선택하기 (최대 24장 연동)</span>
                            </button>
                          ) : (
                            <div className="w-[80%] mx-auto grid grid-cols-2 gap-3">
                              {displayedKidsPhotos.map((photo, idx) => {
                                const focus = photo.faceFocus || { x: 50, y: 26, detected: false };
                                const isZoomOn = photo.zoomEnabled !== false;
                                return (
                                  <div
                                    key={`${photo.id}-${idx}`}
                                    onClick={() => setZoomedPhoto(photo)}
                                    className="group relative h-[190px] sm:h-[206px] rounded-2xl overflow-hidden bg-stone-100 border border-stone-200/70 cursor-pointer"
                                  >
                                    <img
                                      src={photo.dataUrl}
                                      alt={`우리 아이 사진 ${idx + 1}`}
                                      style={
                                        isZoomOn
                                          ? {
                                              objectPosition: `${focus.x}% ${focus.y}%`,
                                              transformOrigin: `${focus.x}% ${focus.y}%`
                                            }
                                          : undefined
                                      }
                                      className={`w-full h-full object-cover transition-transform duration-300 ${
                                        isZoomOn
                                          ? 'scale-[1.35] group-hover:scale-[1.42]'
                                          : 'group-hover:scale-105'
                                      }`}
                                    />
                                    <span className="absolute bottom-2 right-2 px-2 py-0.5 rounded-lg bg-black/50 text-white text-[10px] font-bold opacity-0 group-hover:opacity-100 transition-opacity">
                                      크게 보기
                                    </span>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      )}

                      {/* 홈 화면: 3일치 식단표 (표 형태) */}
                      <div className="flex items-center justify-between px-1">
                        <h2 className="text-base font-extrabold text-slate-900">
                          3일치 식단표{' '}
                          <span className="text-xs font-medium text-slate-400">· 메뉴를 누르면 레시피가 열려요</span>
                        </h2>
                        <button onClick={() => setActiveTab('meals')} className="text-xs font-bold text-orange-600 hover:underline">
                          식단 상세 · 요리완료 →
                        </button>
                      </div>

                      <div className="bg-white/95 rounded-3xl border border-white shadow-sm overflow-x-auto">
                        <table className="w-full min-w-[540px] border-collapse table-fixed">
                          <thead>
                            <tr className="bg-stone-100/90 border-b border-stone-200/80">
                              <th className="w-16 sm:w-20 py-3 px-2.5 text-center text-xs font-extrabold text-slate-600 border-r border-stone-200/70">
                                구분
                              </th>
                              {dateInfos.map((dInfo, offsetIdx) => (
                                <th
                                  key={offsetIdx}
                                  className={`py-3 px-3 text-center border-r last:border-r-0 border-stone-200/70 ${
                                    offsetIdx === 0
                                      ? 'bg-orange-500 text-white'
                                      : 'text-slate-900'
                                  }`}
                                >
                                  <div className="text-xs sm:text-sm font-black">
                                    {dInfo.label}{' '}
                                    <span className={`text-[11px] font-bold ${offsetIdx === 0 ? 'text-orange-100' : 'text-slate-500'}`}>
                                      {dInfo.dateStr}({dInfo.dayName})
                                    </span>
                                  </div>
                                </th>
                              ))}
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-stone-200/70">
                            {['아침', '점심', '저녁'].map((mealType) => (
                              <tr key={mealType}>
                                <th className="py-4 px-2.5 bg-stone-50/90 text-center text-xs sm:text-sm font-extrabold text-slate-800 border-r border-stone-200/70 align-middle">
                                  {mealType}
                                </th>
                                {dateInfos.map((dInfo, offsetIdx) => {
                                  const dayMeals = mealsByOffset[offsetIdx] || [];
                                  const meal = dayMeals.find((m) => m.type === mealType);
                                  const isCellWeekdayLunch = !dInfo.isWeekend && !hasHomeCareKid && mealType === '점심';
                                  const isDone = !!(completedMealsByOffset[offsetIdx] || {})[mealType];

                                  if (isCellWeekdayLunch) {
                                    return (
                                      <td
                                        key={offsetIdx}
                                        className={`py-4 px-3 text-center align-middle border-r last:border-r-0 border-stone-200/70 ${
                                          offsetIdx === 0 ? 'bg-orange-50/30' : 'bg-stone-50/40'
                                        }`}
                                      >
                                        <span className="text-xs font-semibold text-slate-400">기관 급식</span>
                                      </td>
                                    );
